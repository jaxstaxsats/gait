<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIT — Your AI Running Coach</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700;900&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2eb;
    --bg2: #edeae0;
    --ink: #0f0e0b;
    --ink2: #2a2820;
    --muted: #9a9688;
    --accent: #c8f23a;
    --red: #ff3d2e;
    --border: rgba(15,14,11,0.1);
    --display: 'Unbounded', sans-serif;
    --serif: 'Instrument Serif', serif;
    --mono: 'DM Mono', monospace;
  }

  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: var(--mono); min-height: 100vh; }

  /* ── NAV ── */
  nav {
    padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky; top: 0; z-index: 50;
  }
  .nav-logo { font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: -1px; }
  .nav-logo .ai { color: var(--red); }
  .nav-logo .g, .nav-logo .t { color: var(--ink); }
  .nav-tab-bar { display: flex; gap: 4px; }
  .nav-tab {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; padding: 8px 14px; border-radius: 2px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; transition: all 0.2s;
  }
  .nav-tab.active { background: var(--ink); color: var(--accent); border-color: var(--ink); }
  .nav-tab:hover:not(.active) { border-color: var(--ink); color: var(--ink); }

  /* ── VIEWS ── */
  .view { display: none; padding: 32px 24px; max-width: 680px; margin: 0 auto; }
  .view.active { display: block; }

  /* ── QUESTIONNAIRE ── */
  .q-progress {
    display: flex; gap: 4px; margin-bottom: 40px;
  }
  .q-progress-bar {
    height: 3px; flex: 1; background: var(--border); border-radius: 2px;
    transition: background 0.3s;
  }
  .q-progress-bar.done { background: var(--accent); }
  .q-progress-bar.active { background: var(--red); }

  .q-label { font-family: var(--mono); font-size: 10px; letter-spacing: 4px; color: var(--red); text-transform: uppercase; margin-bottom: 12px; }
  .q-title { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 6vw, 48px); letter-spacing: -2px; line-height: 0.95; margin-bottom: 32px; color: var(--ink); }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg2); border: 1px solid var(--border);
    color: var(--ink); font-family: var(--mono); font-size: 14px;
    padding: 14px 16px; border-radius: 4px; outline: none;
    transition: border-color 0.2s; appearance: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--red); }
  .field textarea { min-height: 80px; resize: vertical; }

  .pain-selector { display: flex; gap: 6px; flex-wrap: wrap; }
  .pain-btn {
    width: 44px; height: 44px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg2);
    font-family: var(--display); font-weight: 700; font-size: 14px;
    cursor: pointer; transition: all 0.15s; color: var(--ink);
  }
  .pain-btn:hover { border-color: var(--red); }
  .pain-btn.selected { background: var(--red); color: white; border-color: var(--red); }
  .pain-btn.selected-low { background: var(--accent); color: var(--ink); border-color: var(--accent); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn-row { display: flex; gap: 12px; margin-top: 32px; }
  .btn-back {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
    padding: 14px 20px; border-radius: 4px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  .btn-back:hover { border-color: var(--ink); color: var(--ink); }
  .btn-next {
    flex: 1; background: var(--ink); color: var(--accent);
    font-family: var(--display); font-weight: 900; font-size: 18px; letter-spacing: 1px;
    padding: 16px 24px; border-radius: 4px; border: none; cursor: pointer;
    transition: all 0.2s; text-transform: uppercase;
  }
  .btn-next:hover { background: var(--ink2); transform: translateY(-1px); }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── BLUEPRINT VIEW ── */
  .blueprint-header { margin-bottom: 32px; }
  .blueprint-tag {
    display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    color: var(--ink); background: var(--accent); padding: 4px 10px; border-radius: 2px;
    text-transform: uppercase; margin-bottom: 16px;
  }
  .blueprint-name { font-family: var(--display); font-weight: 900; font-size: clamp(32px, 7vw, 56px); letter-spacing: -2px; line-height: 0.95; margin-bottom: 8px; }
  .blueprint-name .ai { color: var(--red); }
  .blueprint-sub { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .blueprint-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
    padding: 28px; margin-bottom: 16px;
  }
  .blueprint-card h2 {
    font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -0.5px;
    color: var(--red); margin-bottom: 16px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .blueprint-card p { font-family: var(--mono); font-size: 13px; line-height: 1.8; color: var(--ink2); margin-bottom: 10px; }
  .blueprint-card ul { padding-left: 0; list-style: none; }
  .blueprint-card li { font-family: var(--mono); font-size: 13px; line-height: 1.8; color: var(--ink2); padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
  .blueprint-card li::before { content: '✦'; color: var(--accent); font-size: 9px; margin-top: 4px; flex-shrink: 0; }

  .loading-wrap { text-align: center; padding: 80px 24px; }
  .spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  .loading-label { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── DAILY LOG ── */
  .log-header { margin-bottom: 28px; }
  .log-date { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .log-title { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 6vw, 44px); letter-spacing: -2px; line-height: 0.95; }

  .log-section {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
    padding: 24px; margin-bottom: 16px;
  }
  .log-section-title {
    font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    color: var(--red); text-transform: uppercase; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .log-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .rest-day-btn {
    width: 100%; background: transparent; border: 1px dashed var(--border);
    color: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 2px;
    padding: 16px; border-radius: 4px; cursor: pointer; text-transform: uppercase;
    transition: all 0.2s; margin-bottom: 16px;
  }
  .rest-day-btn:hover { border-color: var(--muted); color: var(--ink); }
  .rest-day-btn.selected { background: var(--bg2); border-color: var(--accent); border-style: solid; color: var(--ink); }

  .btn-submit {
    width: 100%; background: var(--ink); color: var(--accent);
    font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: 1px;
    padding: 18px; border-radius: 4px; border: none; cursor: pointer;
    transition: all 0.2s; text-transform: uppercase; margin-top: 24px;
  }
  .btn-submit:hover { background: var(--ink2); }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── AI RESPONSE ── */
  .ai-response {
    background: var(--ink); border-radius: 6px; padding: 28px; margin-top: 24px;
    display: none;
  }
  .ai-response.visible { display: block; }
  .ai-response-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .ai-response-label::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
  .ai-response-body { font-family: var(--mono); font-size: 13px; line-height: 1.9; color: rgba(245,242,235,0.85); }
  .ai-response-body h3 { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--accent); margin: 20px 0 8px; letter-spacing: -0.5px; }
  .ai-response-body h3:first-child { margin-top: 0; }
  .ai-response-body p { margin-bottom: 12px; }
  .ai-response-body ul { padding-left: 0; list-style: none; }
  .ai-response-body li { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; gap: 10px; }
  .ai-response-body li::before { content: '✦'; color: var(--red); font-size: 9px; margin-top: 4px; flex-shrink: 0; }

  /* ── LOG HISTORY ── */
  .history-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
    padding: 20px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.2s;
  }
  .history-card:hover { border-color: var(--red); }
  .history-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .history-date { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .history-km { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -1px; color: var(--ink); }
  .history-pain {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .pain-dot { width: 8px; height: 8px; border-radius: 50%; }
  .pain-dot.low { background: var(--accent); }
  .pain-dot.mid { background: #ff9500; }
  .pain-dot.high { background: var(--red); }
  .pain-dot.none { background: var(--muted); }
  .history-notes { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 24px; }
  .empty-icon { font-size: 40px; margin-bottom: 16px; }
  .empty-title { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -1px; margin-bottom: 8px; }
  .empty-sub { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.7; }

  .section-divider { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin: 28px 0 16px; display: flex; align-items: center; gap: 12px; }
  .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── STATS STRIP ── */
  .stats-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 24px; }
  .stat-box { background: var(--bg2); padding: 16px; text-align: center; }
  .stat-val { font-family: var(--display); font-weight: 900; font-size: 24px; letter-spacing: -1px; color: var(--ink); }
  .stat-key { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

  /* ── PREMIUM BLUEPRINT ── */
  .bp-wrap { padding-bottom: 40px; }
  .bp-hero {
    background: var(--ink); border-radius: 8px;
    padding: 28px; margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .bp-hero::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--red), var(--accent));
  }
  .bp-hero-tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
  }
  .bp-hero-name {
    font-family: var(--display); font-weight: 900;
    font-size: clamp(28px, 6vw, 44px); letter-spacing: -2px;
    color: white; line-height: 1; margin-bottom: 10px;
  }
  .bp-hero-name .ai { color: var(--red); }
  .bp-hero-tagline {
    font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,0.6);
    line-height: 1.6; margin-bottom: 16px;
  }
  .bp-focus-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(200,242,58,0.12); border: 1px solid rgba(200,242,58,0.3);
    border-radius: 20px; padding: 6px 14px;
    font-family: var(--mono); font-size: 11px; color: var(--accent);
  }

  .bp-section { margin-bottom: 16px; }
  .bp-section-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 3px;
    color: var(--red); text-transform: uppercase; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .bp-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Injury alert */
  .bp-injury {
    border-radius: 8px; padding: 20px; margin-bottom: 16px;
    border-left: 4px solid var(--red); background: var(--bg2);
  }
  .bp-injury-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bp-injury-badge {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    text-transform: uppercase; padding: 3px 8px; border-radius: 3px;
    background: var(--red); color: white;
  }
  .bp-injury-title {
    font-family: var(--display); font-weight: 700; font-size: 16px;
    letter-spacing: -0.5px; color: var(--ink);
  }
  .bp-injury-desc {
    font-family: var(--mono); font-size: 12px; color: var(--ink2);
    line-height: 1.7; margin-bottom: 12px;
  }
  .bp-rules { list-style: none; }
  .bp-rules li {
    font-family: var(--mono); font-size: 11px; line-height: 1.6;
    padding: 6px 0; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 8px;
  }
  .bp-rules li:last-child { border-bottom: none; }
  .bp-rule-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
  }
  .bp-rule-dot.green { background: #22c55e; }
  .bp-rule-dot.amber { background: #f59e0b; }
  .bp-rule-dot.red { background: var(--red); }

  /* Weekly grid */
  .bp-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  @media (max-width: 600px) { .bp-week { grid-template-columns: repeat(4, 1fr); } }
  .bp-day {
    border-radius: 6px; padding: 10px 6px; text-align: center;
    border: 1px solid var(--border); background: var(--bg2);
    transition: transform 0.2s;
  }
  .bp-day:hover { transform: translateY(-2px); }
  .bp-day-name {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 6px;
  }
  .bp-day-icon { font-size: 20px; margin-bottom: 6px; display: block; }
  .bp-day-type {
    font-family: var(--display); font-weight: 700; font-size: 9px;
    letter-spacing: -0.3px; color: var(--ink); margin-bottom: 4px;
    line-height: 1.2;
  }
  .bp-day-detail {
    font-family: var(--mono); font-size: 8px; color: var(--muted);
    line-height: 1.4;
  }
  .bp-day.green { border-top: 3px solid #22c55e; }
  .bp-day.yellow { border-top: 3px solid #f59e0b; }
  .bp-day.orange { border-top: 3px solid #f97316; }
  .bp-day.blue { border-top: 3px solid #3b82f6; }
  .bp-day.gray { border-top: 3px solid var(--muted); }

  /* Exercises */
  .bp-exercise {
    background: var(--bg2); border-radius: 8px;
    padding: 16px; margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .bp-ex-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
  }
  .bp-ex-icon {
    width: 44px; height: 44px; border-radius: 8px;
    background: var(--ink); display: flex; align-items: center;
    justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  .bp-ex-title {
    font-family: var(--display); font-weight: 700; font-size: 15px;
    letter-spacing: -0.5px; color: var(--ink); margin-bottom: 2px;
  }
  .bp-ex-sets {
    font-family: var(--mono); font-size: 11px; color: var(--red);
    letter-spacing: 1px;
  }
  .bp-ex-why {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    line-height: 1.6; margin-bottom: 10px; font-style: italic;
  }
  .bp-ex-steps { list-style: none; margin-bottom: 8px; }
  .bp-ex-steps li {
    font-family: var(--mono); font-size: 11px; color: var(--ink2);
    line-height: 1.6; padding: 4px 0;
    display: flex; align-items: flex-start; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .bp-ex-steps li:last-child { border-bottom: none; }
  .bp-ex-step-num {
    background: var(--ink); color: var(--accent);
    font-family: var(--display); font-weight: 700; font-size: 9px;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .bp-ex-cue {
    background: rgba(200,242,58,0.1); border-left: 3px solid var(--accent);
    padding: 6px 10px; border-radius: 0 4px 4px 0;
    font-family: var(--mono); font-size: 10px; color: var(--ink2);
  }

  /* Milestones */
  .bp-milestones { display: flex; flex-direction: column; gap: 8px; }
  .bp-milestone {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px; background: var(--bg2); border-radius: 8px;
    border: 1px solid var(--border);
  }
  .bp-milestone-period {
    font-family: var(--display); font-weight: 900; font-size: 11px;
    color: white; background: var(--ink); padding: 4px 8px;
    border-radius: 4px; white-space: nowrap; flex-shrink: 0; margin-top: 2px;
    min-width: 68px; text-align: center;
  }
  .bp-milestone-target {
    font-family: var(--display); font-weight: 700; font-size: 13px;
    letter-spacing: -0.3px; color: var(--ink); margin-bottom: 2px;
  }
  .bp-milestone-focus {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
  }
  .bp-milestone:last-child .bp-milestone-period {
    background: var(--red);
  }

  /* Daily habit */
  .bp-habit {
    background: var(--ink); border-radius: 8px; padding: 20px;
    border-top: 4px solid var(--accent);
  }
  .bp-habit-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .bp-habit-title {
    font-family: var(--display); font-weight: 700; font-size: 16px;
    letter-spacing: -0.5px; color: white;
  }
  .bp-habit-duration {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    color: var(--accent); text-transform: uppercase;
  }
  .bp-habit-desc {
    font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,0.7);
    line-height: 1.7; margin-bottom: 8px;
  }
  .bp-habit-why {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    font-style: italic;
  }

  /* ── QUOTES ── */
  .quote-block {
    border-left: 3px solid var(--red);
    padding: 12px 16px;
    margin-bottom: 24px;
  }
  .quote-text {
    font-family: var(--serif); font-style: italic;
    font-size: 15px; color: var(--ink2); line-height: 1.6;
    margin-bottom: 4px;
  }
  .quote-attr {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase;
  }
  .loading-quote {
    font-family: var(--serif); font-style: italic;
    font-size: 16px; color: var(--muted); line-height: 1.6;
    max-width: 380px; margin: 20px auto 8px; text-align: center;
  }
  .loading-quote-attr {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    color: var(--border); text-transform: uppercase; text-align: center;
    display: block;
  }

  /* ── EXPANDED LOG ── */
  .expanded-log { display: none; }
  .expanded-log.open { display: block; }
  .expanded-log .ai-response { margin-top: 16px; }

  /* Mobile */
  @media (max-width: 480px) {
    .field-row { grid-template-columns: 1fr; }
    nav { padding: 12px 16px; }
    .nav-tab { padding: 8px 10px; font-size: 9px; }
  }
</style>
</head>
<body>

<!-- NAV -->
<nav>

function renderQ() {
  const container = document.getElementById('q-container');

  // If blueprint exists, show it
  if (blueprint) {
    renderBlueprint();
    return;
  }

  const step = steps[currentStep];
  let html = `<div class="q-progress">`;
  steps.forEach((_, i) => {
    html += `<div class="q-progress-bar ${i < currentStep ? 'done' : i === currentStep ? 'active' : ''}"></div>`;
  });
  html += `</div>`;
  html += `<div class="q-label">${step.label}</div>`;
  html += `<h1 class="q-title">${step.title}</h1>`;

  step.fields.forEach(f => {
    html += `<div class="field"><label>${f.label}</label>`;
    if (f.type === 'select') {
      html += `<select id="q_${f.key}" onchange="answers['${f.key}']=this.value">
        <option value="">Select...</option>
        ${f.options.map(o => `<option value="${o}" ${answers[f.key] === o ? 'selected' : ''}>${o}</option>`).join('')}
      </select>`;
    } else if (f.type === 'textarea') {
      html += `<textarea id="q_${f.key}" placeholder="${f.placeholder}" oninput="answers['${f.key}']=this.value">${answers[f.key] || ''}</textarea>`;
    } else {
      html += `<input type="${f.type}" id="q_${f.key}" placeholder="${f.placeholder}" value="${answers[f.key] || ''}" oninput="answers['${f.key}']=this.value">`;
    }
    html += `</div>`;
  });

  html += `<div class="btn-row">`;
  if (currentStep > 0) html += `<button class="btn-back" onclick="prevStep()">← Back</button>`;
  html += `<button class="btn-next" id="next-btn" onclick="nextStep()">
    ${currentStep === steps.length - 1 ? 'Generate My Blueprint →' : 'Continue →'}
  </button></div>`;

  container.innerHTML = html;
}

function startFreshQ() {
  answers = { _started: true };
  renderQ();
}

async function generateFromBible() {
  const container = document.getElementById('q-container');
  container.innerHTML = `<div class="loading-wrap"><div class="spinner"></div><div class="loading-label">Building your GAIT Blueprint...</div></div>`;

  const prompt = `You are GAIT, an expert injury-aware AI running coach. Generate a personalised GAIT Blueprint for Jax based on this detailed training bible data.

${JAX_BIBLE}

Write the GAIT Blueprint using these exact sections with ## headings:

## Who You Are As A Runner
3-4 sentences. Personal, specific, addresses Jax's background and the #1 thing to protect based on PFPS history and the recent back-of-knee signal.

## Your Primary Injury Risk
The main risks based on Jax's history. 3 specific things to watch for and 2 non-negotiable daily habits to prevent reinjury.

## Your Weekly Training Template
Mon–Sun. Specific distances, paces, and purpose for each day. Calibrated to current 20-25km/week and targeting half marathon.

## Your Mileage Rules
6 specific rules for Jax — when to push, when to back off, based on PFPS history, hilly Porto terrain, and marathon goal.

## Your Milestone Roadmap
Month 1 (Apr), Month 2 (May), Month 3 (Jun), then Q3, Q4 2026, then 2027 ultra. Specific and motivating.

## Your Non-Negotiable Daily Habit
One thing. Specific to PFPS and patellar tendon history. Concrete. No more than 3 sentences.

Write with authority, warmth and deep specificity. You know this runner well. No preamble or sign-off.`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text;
    if (text) {
      blueprint = text;
      profileData = { name: 'Jax', age: 39, weight: 75 };
      localStorage.setItem('gait_blueprint', blueprint);
      localStorage.setItem('gait_profile', JSON.stringify(profileData));
      renderBlueprint();
    }
  } catch (e) {
    container.innerHTML = `<p style="color:var(--red);font-family:var(--mono);font-size:13px;padding:20px;">Something went wrong. Please try again.</p>
    <button class="btn-next" onclick="generateFromBible()" style="width:100%;margin-top:16px;">Try again →</button>`;
  }
}



function nextStep() {
  const step = steps[currentStep];
  const allFilled = step.fields.every(f => answers[f.key]?.toString().trim());
  if (!allFilled) {
    alert('Please fill in all fields before continuing.');
    return;
  }
  if (currentStep < steps.length - 1) {
    currentStep++;
    renderQ();
  } else {
    showEmailCapture();
  }
}

async function captureEmailAndGenerate() {
  const email = document.getElementById('capture-email').value;
  const newsletter = document.getElementById('newsletter-opt').checked;

  if (!email || !email.includes('@')) {
    alert('Please enter a valid email address.');
    return;
  }

  answers.email = email;
  answers.newsletterOptIn = newsletter;

  // Store email in localStorage for reference
  const signups = JSON.parse(localStorage.getItem('gait_signups') || '[]');
  signups.push({
    date: new Date().toISOString(),
    email,
    newsletter,
    name: answers.name,
    goal: answers.raceGoal
  });
  localStorage.setItem('gait_signups', JSON.stringify(signups));

  // Send to secure backend which calls Airtable
  try {
    await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: answers.name || '',
        email,
        newsletter,
        goal: answers.raceGoal || '',
        injuries: answers.injuries || '',
        terrain: answers.terrain || ''
      })
    });
  } catch (e) {
    // Fail silently — don't block blueprint generation
  }

  generateBlueprint();
}

async function generateBlueprint() {
  const container = document.getElementById('q-container');
  const lq = getRandomQuote(LOADING_QUOTES);
  container.innerHTML = `<div class="loading-wrap">
    <div class="spinner"></div>
    <div class="loading-label">Building your GAIT Blueprint...</div>
    <div class="loading-quote">"${lq.text}"</div>
    <span class="loading-quote-attr">— ${lq.attr}</span>
  </div>`;

  const GAIT_SYSTEM = `You are GAIT, an expert injury-aware AI running coach with deep knowledge of sports science, rehabilitation, strength and conditioning, and endurance training. You were built specifically for comeback runners, injury-prone runners, and anyone who has been let down by generic training plans.

GAIT COACHING PHILOSOPHY — apply these always:
- Injury prevention always comes before performance. A runner who stays healthy improves faster than one who trains hard and breaks down.
- Every recommendation must be filtered through the runner's full injury history. There are no generic plans.
- The 10% rule applies to ALL variables — mileage, elevation, intensity, and frequency. Never increase more than one variable at a time.
- Pain signals are data. 1-2/10 = whisper, modify and monitor. 3-4/10 = warning, reduce load significantly. 5+/10 = stop sign, rest only.
- Desk-based and sedentary runners always need extra glute activation and hip stability work — years of sitting creates gluteal amnesia that directly causes knee and back injuries.
- Conservative is always better than aggressive for comeback runners. Build the base before adding intensity.
- The goal is always to get the runner to the start line healthy, not just trained.

EXERCISE SELECTION PRINCIPLES — use your full knowledge of exercise science:
- Choose exercises based on the runner's specific injury history, weak points, terrain, and goal race — not from a fixed list
- For any injury, always prescribe exercises that address the ROOT CAUSE not just the symptom (e.g. PFPS root cause = weak VMO and glute medius, not just tight quads)
- Match exercise complexity to the runner's experience level — beginners need simpler progressions
- For marathon and ultra runners: prioritise eccentric strength, single-leg stability, and posterior chain work
- For hilly terrain runners: add extra quad eccentric strength (downhill control) and calf resilience work
- For desk workers: always start with glute activation before any lower body strength work
- Balance the circuit: always include hip stability, knee strength, core anti-rotation, and calf/ankle work
- Mobility work should always address the specific tight areas caused by the runner's injury history and lifestyle

INJURY-SPECIFIC RULES — these are non-negotiable:
- PFPS (kneecap pain): Always include VMO strengthening and glute medius work. Never prescribe deep knee flexion when pain is above 2/10. Isometric exercises (wall sit) are safest when flaring.
- Calf strain: Always include both gastrocnemius AND soleus stretches. Eccentric heel drops for long-term prevention. No speed work or hills until 0/10 for 3 days.
- Groin strain: Remove all split squats, deep lunges and aggressive hip flexor stretches. Use passive adductor stretches only. No return to speed work until 0/10 for 5 days.
- IT band syndrome: Prioritise hip abductor strength and glute medius work. Avoid steep downhills when active. Foam rolling the IT band does not fix it — the root cause is hip weakness.
- Plantar fasciitis: Calf flexibility is critical. Intrinsic foot strengthening. Avoid barefoot running on hard surfaces when active.
- Lower back: Always include deep core stabilisation (bird dogs, dead bugs) and glute activation before any run or workout. Never prescribe heavy loaded flexion when active.
- Achilles tendinopathy: Eccentric heel drops are the gold standard. No aggressive stretching when acutely painful. Load management is everything.
- General rule: If any pain is 4/10 or above — prescribe rest and recovery only. Never train through it.

GOAL-SPECIFIC TRAINING PRINCIPLES:
- 5km/10km: Higher intensity tolerance needed. More interval work once base is solid. Speed development matters.
- Half marathon: Aerobic base is everything. Long runs at conversational pace. One quality session per week maximum.
- Marathon: Conservative mileage build. Back-to-back long runs later in training. Race-specific long runs over 26km.
- Ultra marathon: Time on feet over pace. Trail-specific strength. Back-to-back long runs essential. Mental resilience training.
- Beginners: No speed work in first 8 weeks. Build to 30 min continuous before adding distance. Strength twice a week from day one.
- Comeback runners: Treat first 6-8 weeks as pure base building regardless of previous fitness. Connective tissue adapts slower than cardiovascular fitness.`;

  const prompt = `${GAIT_SYSTEM}

Generate a personalised GAIT Blueprint for this runner. Respond ONLY with a valid JSON object — no markdown, no backticks, no explanation before or after.

RUNNER PROFILE:
Name: ${answers.name} | Age: ${answers.age} | Gender: ${answers.gender} | Weight: ${answers.weight}kg | Height: ${answers.height}cm
Years running: ${answers.yearsRunning} | Comfortable pace: ${answers.currentPace} | Longest race: ${answers.longestRace}
A run they are proud of: ${answers.proudRun}
Current weekly km: ${answers.weeklyKm} | Weekly structure: ${answers.weeklyStructure} | Cross-training: ${answers.crossTraining}
Terrain: ${answers.terrain} | Training days available: ${answers.daysPerWeek} | Strength training: ${answers.strengthTraining}
Equipment: ${answers.equipment || 'Not specified'} | Equipment details: ${answers.equipmentDetail || 'None specified'}
Flexibility: ${answers.flexibility} | Sleep: ${answers.sleepQuality}
Work type: ${answers.job} | Stress: ${answers.stressLevel} | Nutrition: ${answers.nutrition}

INJURY & HEALTH HISTORY:
Injuries: ${answers.injuries}
Surgeries: ${answers.surgeries}
Chronic conditions: ${answers.chronicConditions}
Current pain level: ${answers.currentPain}
Has injury stopped running before: ${answers.previousInjuryStop}
Current recovery methods: ${answers.recoveryMethods}

GOALS:
Short term (8-12 weeks): ${answers.shortGoal}
Race goal (6 months): ${answers.raceGoal}
Race preference: ${answers.racePreference}
Big vision (1-2 years): ${answers.bigVision}
Biggest fear: ${answers.biggestFear}
Primary motivation: ${answers.motivation}
Secondary goals: ${answers.secondaryGoals}

Return ONLY this JSON — no text before or after, no markdown backticks:
{
  "name": "first name only",
  "tagline": "one sentence about who this runner is",
  "primaryFocus": "the #1 thing to protect in one sentence",
  "injuryAlert": {
    "title": "main injury name",
    "level": "high",
    "description": "2 sentences specific to this runner",
    "rules": ["rule 1", "rule 2", "rule 3"]
  },
  "weeklyPlan": [
    {"day": "MON", "type": "Easy Run", "detail": "6-8km @ 6:00/km", "purpose": "Aerobic base", "icon": "🏃", "color": "green"},
    {"day": "TUE", "type": "Strength", "detail": "30 min circuit", "purpose": "Injury prevention", "icon": "💪", "color": "blue"},
    {"day": "WED", "type": "Moderate Run", "detail": "8-10km @ 5:45/km", "purpose": "Fitness build", "icon": "🏃", "color": "yellow"},
    {"day": "THU", "type": "Rest", "detail": "Mobility only", "purpose": "Recovery", "icon": "🧘", "color": "gray"},
    {"day": "FRI", "type": "Strength", "detail": "30 min circuit", "purpose": "Injury prevention", "icon": "💪", "color": "blue"},
    {"day": "SAT", "type": "Long Run", "detail": "10-13km @ 6:00/km", "purpose": "Endurance", "icon": "🏃", "color": "orange"},
    {"day": "SUN", "type": "Full Rest", "detail": "NSDR + stretch", "purpose": "Full recovery", "icon": "😴", "color": "gray"}
  ],
  "exercises": [
    {"name": "Exercise 1", "sets": "3 × 15", "icon": "🦵", "why": "one sentence why for this runner", "steps": ["step 1", "step 2", "step 3"], "cue": "key coaching cue"},
    {"name": "Exercise 2", "sets": "3 × 12", "icon": "💪", "why": "one sentence why for this runner", "steps": ["step 1", "step 2", "step 3"], "cue": "key coaching cue"},
    {"name": "Exercise 3", "sets": "2 × 10", "icon": "🏋️", "why": "one sentence why for this runner", "steps": ["step 1", "step 2", "step 3"], "cue": "key coaching cue"},
    {"name": "Exercise 4", "sets": "3 × 15", "icon": "🧘", "why": "one sentence why for this runner", "steps": ["step 1", "step 2", "step 3"], "cue": "key coaching cue"}
  ],
  "mileageRules": [
    {"rule": "rule 1", "type": "green"},
    {"rule": "rule 2", "type": "amber"},
    {"rule": "rule 3", "type": "red"},
    {"rule": "rule 4", "type": "amber"},
    {"rule": "rule 5", "type": "green"}
  ],
  "milestones": [
    {"period": "Month 1", "target": "specific target", "focus": "focus area"},
    {"period": "Month 2", "target": "specific target", "focus": "focus area"},
    {"period": "Month 3", "target": "specific target", "focus": "focus area"},
    {"period": "6 Months", "target": "race goal target", "focus": "race focus"},
    {"period": "Big Vision", "target": "their big vision", "focus": "ultimate goal"}
  ],
  "morningRoutine": [
    {"name": "Movement name", "duration": "1 min", "icon": "🌅", "instruction": "exactly how to do it in one sentence", "why": "why this matters for their specific injuries"}
  ],
  "eveningRoutine": [
    {"name": "Stretch/recovery name", "duration": "1 min each side", "icon": "🌙", "instruction": "exactly how to do it in one sentence", "why": "why this matters for their specific injuries"}
  ],
  "dailyHabit": {
    "title": "habit name",
    "duration": "X minutes daily",
    "description": "exactly what to do in 2 sentences",
    "why": "why this prevents their specific injury"
  }
}

Fill in all fields with content specific to this runner. Use their actual injury names, pace, terrain and goals.`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text;
    if (text) {
      try {
        const clean = text.replace(/```json|```/g, '').trim();
        blueprint = JSON.parse(clean);
      } catch(parseErr) {
        // If JSON parse fails, show the raw text so we can debug
        container.innerHTML = `
          <p style="color:var(--red);font-family:var(--mono);font-size:12px;padding:20px 0;">JSON parse error. Raw response:</p>
          <pre style="font-size:10px;overflow:auto;background:var(--bg2);padding:12px;border-radius:4px;">${text.substring(0, 500)}</pre>
          <button class="btn-next" onclick="generateBlueprint()" style="width:100%;margin-top:16px;">Try again →</button>`;
        return;
      }
      profileData = { ...answers };
      localStorage.setItem('gait_blueprint', JSON.stringify(blueprint));
      localStorage.setItem('gait_profile', JSON.stringify(profileData));
      renderBlueprint();
    } else if (data.error) {
      container.innerHTML = `
        <p style="color:var(--red);font-family:var(--mono);font-size:12px;padding:20px 0;">API Error: ${data.error?.message || JSON.stringify(data.error)}</p>
        <button class="btn-next" onclick="generateBlueprint()" style="width:100%;margin-top:16px;">Try again →</button>`;
    }
  } catch (e) {
    container.innerHTML = `
      <p style="color:var(--red);font-family:var(--mono);font-size:13px;padding:20px 0;">
        Error: ${e.message}. Please try again.
      </p>
      <button class="btn-next" onclick="generateBlueprint()" style="width:100%;margin-top:16px;">Try again →</button>`;
  }
}

function renderBlueprint() {
  const container = document.getElementById('q-container');
  const b = typeof blueprint === 'string' ? JSON.parse(blueprint) : blueprint;
  const name = b.name || profileData?.name || answers.name || 'Your';

  const ruleColor = (type) => {
    if (type === 'green') return 'green';
    if (type === 'amber') return 'amber';
    return 'red';
  };

  const dayColorClass = (color) => color || 'gray';

  let html = `<div class="bp-wrap">

  <!-- HERO -->
  <div class="bp-hero">
    <div class="bp-hero-tag">✦ GAIT Blueprint — Generated ${new Date().toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'})}</div>
    <div class="bp-hero-name">${name}'s<br>G<span class="ai">AI</span>T Plan</div>
    <div class="bp-hero-tagline">${b.tagline || ''}</div>
    <div class="bp-focus-pill">🎯 ${b.primaryFocus || ''}</div>
  </div>

  <!-- INJURY ALERT -->
  <div class="bp-section-label">Injury alert</div>
  <div class="bp-injury">
    <div class="bp-injury-header">
      <div class="bp-injury-badge">${b.injuryAlert?.level || 'monitor'}</div>
      <div class="bp-injury-title">${b.injuryAlert?.title || ''}</div>
    </div>
    <div class="bp-injury-desc">${b.injuryAlert?.description || ''}</div>
    <ul class="bp-rules">
      ${(b.injuryAlert?.rules || []).map((r, i) => `
        <li>
          <div class="bp-rule-dot ${i === 0 ? 'green' : i === 1 ? 'amber' : 'red'}"></div>
          <span>${r}</span>
        </li>`).join('')}
    </ul>
  </div>

  <!-- WEEKLY PLAN -->
  <div class="bp-section-label">Your week</div>
  <div class="bp-week">
    ${(b.weeklyPlan || []).map(d => `
      <div class="bp-day ${dayColorClass(d.color)}">
        <div class="bp-day-name">${d.day}</div>
        <span class="bp-day-icon">${d.icon}</span>
        <div class="bp-day-type">${d.type}</div>
        <div class="bp-day-detail">${d.detail}</div>
      </div>`).join('')}
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:8px;">
    ${(b.weeklyPlan || []).map(d => `
      <div style="background:var(--bg2);border-radius:6px;padding:8px 10px;border:1px solid var(--border);">
        <div style="font-family:var(--display);font-weight:700;font-size:10px;color:var(--ink);margin-bottom:3px;">${d.day} — ${d.type}</div>
        <div style="font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.5;">${d.purpose}</div>
      </div>`).join('')}
  </div>

  <!-- EXERCISES -->
  <div class="bp-section-label" style="margin-top:20px;">Your strength circuit</div>
  ${(b.exercises || []).map(ex => `
    <div class="bp-exercise">
      <div class="bp-ex-header">
        <div class="bp-ex-icon">${ex.icon}</div>
        <div>
          <div class="bp-ex-title">${ex.name}</div>
          <div class="bp-ex-sets">${ex.sets}</div>
        </div>
      </div>
      <div class="bp-ex-why">"${ex.why}"</div>
      <ul class="bp-ex-steps">
        ${(ex.steps || []).map((s, i) => `
          <li>
            <div class="bp-ex-step-num">${i+1}</div>
            <span>${s}</span>
          </li>`).join('')}
      </ul>
      <div class="bp-ex-cue">💡 ${ex.cue}</div>
    </div>`).join('')}

  <!-- MORNING ROUTINE -->
  <div class="bp-section-label" style="margin-top:20px;">Morning routine</div>
  <div style="background:var(--bg2);border-radius:8px;padding:16px;border:1px solid var(--border);">
    <p style="font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6;">Do this every morning before your run or within 30 minutes of waking. Takes 8–12 minutes.</p>
    ${(b.morningRoutine || []).map((m, i) => `
      <div style="display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="width:36px;height:36px;background:var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">${m.icon}</div>
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">

  <div class="bp-section-label" style="margin-top:20px;">Evening routine</div>

      <div style="display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.08);">

            <div style="font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:1px;">${e.duration}</div>
          </div>
          <div style="font-family:var(--mono);font-size:11px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:3px;">${e.instruction}</div>
          <div style="font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.4);font-style:italic;">${e.why}</div>
        </div>
      </div>`).join('')}
  </div>

  <!-- MILEAGE RULES -->
  <div class="bp-section-label" style="margin-top:20px;">Mileage rules</div>
  <div style="background:var(--bg2);border-radius:8px;padding:16px;border:1px solid var(--border);">

      ${(b.mileageRules || []).map(r => `
        <li>
          <div class="bp-rule-dot ${ruleColor(r.type)}"></div>
          <span style="font-family:var(--mono);font-size:11px;color:var(--ink2);line-height:1.6;">${r.rule}</span>
        </li>`).join('')}
    </ul>
  </div>

  <!-- MILESTONES -->
  <div class="bp-section-label" style="margin-top:20px;">Your roadmap</div>
  <div class="bp-milestones">
    ${(b.milestones || []).map(m => `
      <div class="bp-milestone">
        <div class="bp-milestone-period">${m.period}</div>
        <div>
          <div class="bp-milestone-target">${m.target}</div>
          <div class="bp-milestone-focus">${m.focus}</div>
        </div>
      </div>`).join('')}
  </div>

  <!-- DAILY HABIT -->
  <div class="bp-section-label" style="margin-top:20px;">Daily non-negotiable</div>
  <div class="bp-habit">
    <div class="bp-habit-header">
      <div class="bp-habit-title">${b.dailyHabit?.title || ''}</div>
      <div class="bp-habit-duration">${b.dailyHabit?.duration || ''}</div>
    </div>
    <div class="bp-habit-desc">${b.dailyHabit?.description || ''}</div>
    <div class="bp-habit-why">Why: ${b.dailyHabit?.why || ''}</div>
  </div>

  <!-- ACTIONS -->
  <div style="display:flex;gap:12px;margin-top:24px;flex-wrap:wrap;">
    <button onclick="resetBlueprint()" style="flex:1;background:transparent;border:1px solid var(--border);color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:2px;padding:14px 20px;border-radius:4px;cursor:pointer;text-transform:uppercase;min-width:140px;">
      Regenerate
    </button>
    <button onclick="showView('log')" style="flex:2;background:var(--ink);color:var(--accent);font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:1px;padding:14px 20px;border-radius:4px;border:none;cursor:pointer;text-transform:uppercase;min-width:160px;">
      Start Daily Log →
    </button>
  </div>

  </div>`;

  container.innerHTML = html;
}

function resetBlueprint() {
  if (!confirm('This will clear your current blueprint. Are you sure?')) return;
  blueprint = null;
  localStorage.removeItem('gait_blueprint');
  currentStep = 0;
  answers = {};
  renderQ();
}

function initLog() {
  const now = new Date();
  document.getElementById('log-date').textContent = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  updateStats();

  // Daily quote
  const q = getDailyQuote();
  document.getElementById('daily-quote').innerHTML = `
    <div class="quote-text">"${q.text}"</div>
    <div class="quote-attr">— ${q.attr}</div>`;

  // Auto calculate pace
  document.getElementById('log-km').addEventListener('input', calcPace);
  document.getElementById('log-time').addEventListener('input', calcPace);
}

function calcPace() {
  const km = parseFloat(document.getElementById('log-km').value);
  const timeStr = document.getElementById('log-time').value;
  if (!km || !timeStr) return;
  const parts = timeStr.split(':');
  if (parts.length !== 2) return;
  const totalMins = parseInt(parts[0]) + parseInt(parts[1]) / 60;
  if (!totalMins || km === 0) return;
  const paceMin = Math.floor(totalMins / km);
  const paceSec = Math.round(((totalMins / km) - paceMin) * 60);
  document.getElementById('log-pace').value = `${paceMin}:${paceSec.toString().padStart(2, '0')}`;
}

function selectPain(val) {
  selectedPain = val;
  document.querySelectorAll('.pain-btn').forEach((btn, i) => {
    btn.className = 'pain-btn';
    if (i === val) btn.className += val <= 2 ? ' selected-low' : ' selected';
  });
}

function toggleRestDay() {
  isRestDay = !isRestDay;
  const btn = document.getElementById('rest-day-btn');
  const fields = document.getElementById('run-fields');
  btn.className = isRestDay ? 'rest-day-btn selected' : 'rest-day-btn';
  btn.textContent = isRestDay ? '✓ Rest day marked' : '🛌 Mark as rest day';
  fields.style.display = isRestDay ? 'none' : 'block';
}

async function submitLog() {
  const btn = document.getElementById('submit-btn');
  const responseEl = document.getElementById('ai-response');

  const notes = document.getElementById('log-notes').value;

  if (!isRestDay) {

    const effort = document.getElementById('log-effort').value;
    if (!km || !effort) { alert('Please fill in your run distance and effort level.'); return; }
  }

  if (!notes) { alert('Please add some notes about how you felt.'); return; }

  btn.disabled = true;
  btn.textContent = 'Getting your coaching...';
  responseEl.classList.add('visible');

  // Use Jax's bible if no profile generated yet, otherwise use stored profile
  const bibleContext = blueprint || JAX_BIBLE;
  const recentLogs = logs.slice(-7).map(l =>
    `${new Date(l.date).toLocaleDateString('en-GB')}: ${l.isRestDay ? 'REST DAY' : `${l.km}km @ ${l.pace}/km, effort ${l.effort}`} | Pain: ${l.painScore}/10 at ${l.painLoc} | Notes: ${l.notes}`
  ).join('\n');

  const prompt = `You are GAIT, an expert injury-aware AI running coach. Your job is to respond to today's training log with specific, personalised coaching — not generic advice.

GAIT COACHING RULES:
- Always reference the runner's specific injury history when giving advice
- Pain at 1-2/10 = modify and monitor. Pain at 3-4/10 = reduce load significantly. Pain at 5+/10 = stop and rest.
- Never prescribe speed work or long runs when any injury signal is above 2/10
- Recovery protocol must be specific to the exact pain location logged — not generic stretching
- Always cross-reference today's data against the recent log history for patterns
- If the runner has logged the same pain location 3+ times this week, escalate the response
- Sleep under 6hrs and high stress = reduce tomorrow's planned load by 20-30%

RECOVERY PRINCIPLES — use your full knowledge to prescribe the right recovery:
- Match recovery to the exact pain location and injury type logged today
- For acute pain (new or sharp): ice, rest, no stretching of the affected area
- For chronic tightness (familiar, dull): targeted stretching and mobility work

- For tendon issues: isometric exercises reduce pain fastest — prescribe these first

- Recovery after easy runs: 10-15 min mobility only
- Recovery after hard runs: full stretching protocol plus targeted injury work
- Recovery after long runs: elevation, nutrition focus, sleep priority, light mobility only next morning

RUNNER'S BLUEPRINT & FULL HISTORY:
${bibleContext}

RECENT LOG HISTORY (last 7 entries):
${recentLogs || 'No previous logs yet — this is their first entry'}

TODAY'S LOG:
Date: ${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}
${isRestDay ? 'REST DAY — no running today' : `Distance: ${km}km | Time: ${time} | Pace: ${pace}/km | Effort: ${effort} | Terrain: ${terrain}`}
Pre-run pain/tightness: ${prePain}
Pain during/after: ${painLoc} | Pain score: ${painScore}/10
Sleep last night: ${sleep || 'Not specified'}
Stress level: ${stress || 'Not specified'}
Notes: ${notes}

Respond with ONLY a JSON object — no text before or after, no markdown backticks:
{
  "assessment": {
    "emoji": "one emoji that captures today",
    "headline": "one punchy sentence summarising today",
    "detail": "2-3 sentences specific to their data, injury history and patterns"
  },
  "recovery": [
    {
      "name": "exercise or stretch name",
      "duration": "e.g. 60 sec each side",
      "icon": "relevant emoji",

    }
  ],
  "tomorrowPlan": {
    "type": "Run / Strength / Rest / Active Recovery",
    "icon": "relevant emoji",
    "detail": "exact km range and pace if running, or what to do if not",
    "reason": "one sentence why this is the right call based on today"
  },

    "pattern": "the specific thing to watch",
    "action": "one concrete action to take"
  }
}`;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text;
    if (text) {

      try {

function formatAIResponse(text) {
  return text
    .replace(/### (.+)/g, '<h3>$1</h3>')
    .replace(/## (.+)/g, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^- (.+)/gm, '<li>$1</li>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^(?!<[hl])/gm, '')
    .split('\n').map(line => {
      if (line.startsWith('<h') || line.startsWith('<li') || line === '') return line;
      return `<p>${line}</p>`;
    }).join('');
}

function renderHistory() {
  const container = document.getElementById('history-container');

  if (logs.length === 0) {
    container.innerHTML = `<div class="empty-state">
      <div class="empty-icon">🏃</div>
      <div class="empty-title">No runs logged yet</div>
      <div class="empty-sub">Head to Daily Log to record your first run.<br>Your history will build up here over time.</div>
    </div>`;
    return;
  }

  const totalKm = logs.filter(l => !l.isRestDay).reduce((s, l) => s + parseFloat(l.km || 0), 0);
  const totalRuns = logs.filter(l => !l.isRestDay).length;

  let html = `<div class="stats-strip" style="margin-bottom:24px;">
    <div class="stat-box"><div class="stat-val">${totalRuns}</div><div class="stat-key">Total runs</div></div>
    <div class="stat-box"><div class="stat-val">${totalKm.toFixed(1)}</div><div class="stat-key">Total km</div></div>
    <div class="stat-box"><div class="stat-val">${logs.length}</div><div class="stat-key">Days logged</div></div>
  </div>`;

  html += `<div class="section-divider">Recent entries</div>`;

  [...logs].reverse().forEach((log, i) => {
    const d = new Date(log.date);
    const dateStr = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
    const painClass = log.painScore === 0 || log.painScore === 'Not specified' ? 'none' : log.painScore <= 2 ? 'low' : log.painScore <= 4 ? 'mid' : 'high';

    html += `<div class="history-card" onclick="toggleExpanded(${logs.length - 1 - i})">
      <div class="history-card-top">
        <div>
          <div class="history-date">${dateStr}</div>
          <div class="history-km">${log.isRestDay ? 'Rest day' : `${log.km} km`}</div>
        </div>
        <div class="history-pain">
          <div class="pain-dot ${painClass}"></div>
          ${log.isRestDay ? 'Recovery' : `Pain ${log.painScore}/10`}
        </div>
      </div>
      ${!log.isRestDay ? `<div class="history-notes">${log.pace}/km · ${log.effort} · ${log.terrain}</div>` : ''}
      ${log.notes ? `<div class="history-notes" style="margin-top:6px;">${log.notes.substring(0, 100)}${log.notes.length > 100 ? '...' : ''}</div>` : ''}
    </div>
    <div class="expanded-log" id="expanded-${logs.length - 1 - i}">
      ${log.aiResponse ? `<div class="ai-response visible" style="margin-bottom:16px;">
        <div class="ai-response-label">GAIT coaching response</div>
        <div class="ai-response-body">${formatAIResponse(log.aiResponse)}</div>
      </div>` : ''}
    </div>`;
  });

  container.innerHTML = html;
}

function toggleExpanded(idx) {
  const el = document.getElementById(`expanded-${idx}`);
  el.classList.toggle('open');
}

function updateStats() {
  const runs = logs.filter(l => !l.isRestDay);
  const totalKm = runs.reduce((s, l) => s + parseFloat(l.km || 0), 0);
  document.getElementById('stat-runs').textContent = runs.length;
  document.getElementById('stat-km').textContent = totalKm.toFixed(1);
  // Streak
  let streak = 0;
  const today = new Date().toDateString();
  for (let i = logs.length - 1; i >= 0; i--) {
    const d = new Date(logs[i].date);
    const expected = new Date();
    expected.setDate(expected.getDate() - streak);
    if (d.toDateString() === expected.toDateString()) streak++;
    else break;
  }
  document.getElementById('stat-streak').textContent = streak;
}

function parseMarkdown(text) {
  const lines = text.split('\n');
  const sections = [];
  let current = null;
  for (const line of lines) {
    if (line.startsWith('## ')) {
      if (current) sections.push(current);
      current = { heading: line.replace('## ', ''), content: '' };
    } else if (current) {
      if (line.startsWith('- ') || line.startsWith('• ')) {
        current.content += `<ul><li>${line.replace(/^[-•]\s/, '')}</li></ul>`;
      } else if (line.trim()) {
        current.content += `<p>${line}</p>`;
      }
    }
  }
  if (current) sections.push(current);
  return sections;
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`view-${name}`).classList.add('active');
  event.target.classList.add('active');
  if (name === 'history') renderHistory();
}
