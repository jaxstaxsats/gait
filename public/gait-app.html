<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIT — Your AI Running Coach</title>
<script>
  // Redirect .html URL to clean URL
  if (window.location.pathname === '/gait-app.html') {
    window.location.replace('/gait-app');
  }
</script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;700;900&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f2eb;
    --bg2: #edeae0;
    --ink: #0f0e0b;
    --ink2: #2a2820;
    --muted: #9a9688;
    --accent: #c8f23a;
    --red: #ff3d2e;
    --border: rgba(15,14,11,0.1);
    --display: 'Unbounded', sans-serif;
    --serif: 'Instrument Serif', serif;
    --mono: 'DM Mono', monospace;
  }

  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--ink); font-family: var(--mono); min-height: 100vh; }

  /* ── NAV ── */
  nav {
    padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky; top: 0; z-index: 50;
  }
  .nav-logo { font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: -1px; }
  .nav-logo .ai { color: var(--red); }
  .nav-logo .g, .nav-logo .t { color: var(--ink); }
  .nav-tab-bar { display: flex; gap: 4px; }
  .nav-tab {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; padding: 8px 14px; border-radius: 2px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; transition: all 0.2s;
  }
  .nav-tab.active { background: var(--ink); color: var(--accent); border-color: var(--ink); }
  .nav-tab:hover:not(.active) { border-color: var(--ink); color: var(--ink); }

  /* ── VIEWS ── */
  .view { display: none; padding: 32px 24px; max-width: 680px; margin: 0 auto; }
  .view.active { display: block; }

  /* ── QUESTIONNAIRE ── */
  .q-progress {
    display: flex; gap: 4px; margin-bottom: 40px;
  }
  .q-progress-bar {
    height: 3px; flex: 1; background: var(--border); border-radius: 2px;
    transition: background 0.3s;
  }
  .q-progress-bar.done { background: var(--accent); }
  .q-progress-bar.active { background: var(--red); }

  .q-label { font-family: var(--mono); font-size: 10px; letter-spacing: 4px; color: var(--red); text-transform: uppercase; margin-bottom: 12px; }
  .q-title { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 6vw, 48px); letter-spacing: -2px; line-height: 0.95; margin-bottom: 32px; color: var(--ink); }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
  .field input, .field select, .field textarea {
    width: 100%; background: var(--bg2); border: 1px solid var(--border);
    color: var(--ink); font-family: var(--mono); font-size: 14px;
    padding: 14px 16px; border-radius: 4px; outline: none;
    transition: border-color 0.2s; appearance: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--red); }
  .field textarea { min-height: 80px; resize: vertical; }

  .pain-selector { display: flex; gap: 6px; flex-wrap: wrap; }
  .pain-btn {
    width: 44px; height: 44px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg2);
    font-family: var(--display); font-weight: 700; font-size: 14px;
    cursor: pointer; transition: all 0.15s; color: var(--ink);
  }
  .pain-btn:hover { border-color: var(--red); }
  .pain-btn.selected { background: var(--red); color: white; border-color: var(--red); }
  .pain-btn.selected-low { background: var(--accent); color: var(--ink); border-color: var(--accent); }

  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn-row { display: flex; gap: 12px; margin-top: 32px; }
  .btn-back {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    font-family: var(--mono); font-size: 11px; letter-spacing: 2px;
    padding: 14px 20px; border-radius: 4px; cursor: pointer; transition: all 0.2s; text-transform: uppercase;
  }
  .btn-back:hover { border-color: var(--ink); color: var(--ink); }
  .btn-next {
    flex: 1; background: var(--ink); color: var(--accent);
    font-family: var(--display); font-weight: 900; font-size: 18px; letter-spacing: 1px;
    padding: 16px 24px; border-radius: 4px; border: none; cursor: pointer;
    transition: all 0.2s; text-transform: uppercase;
  }
  .btn-next:hover { background: var(--ink2); transform: translateY(-1px); }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* ── BLUEPRINT VIEW ── */
  .blueprint-header { margin-bottom: 32px; }
  .blueprint-tag {
    display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    color: var(--ink); background: var(--accent); padding: 4px 10px; border-radius: 2px;
    text-transform: uppercase; margin-bottom: 16px;
  }
  .blueprint-name { font-family: var(--display); font-weight: 900; font-size: clamp(32px, 7vw, 56px); letter-spacing: -2px; line-height: 0.95; margin-bottom: 8px; }
  .blueprint-name .ai { color: var(--red); }
  .blueprint-sub { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .blueprint-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
    padding: 28px; margin-bottom: 16px;
  }
  .blueprint-card h2 {
    font-family: var(--display); font-weight: 700; font-size: 18px; letter-spacing: -0.5px;
    color: var(--red); margin-bottom: 16px; padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .blueprint-card p { font-family: var(--mono); font-size: 13px; line-height: 1.8; color: var(--ink2); margin-bottom: 10px; }
  .blueprint-card ul { padding-left: 0; list-style: none; }
  .blueprint-card li { font-family: var(--mono); font-size: 13px; line-height: 1.8; color: var(--ink2); padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
  .blueprint-card li::before { content: '✦'; color: var(--accent); font-size: 9px; margin-top: 4px; flex-shrink: 0; }

  .loading-wrap { text-align: center; padding: 80px 24px; }
  .spinner { width: 36px; height: 36px; border: 2px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  .loading-label { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── DAILY LOG ── */
  .log-header { margin-bottom: 28px; }
  .log-date { font-family: var(--mono); font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .log-title { font-family: var(--display); font-weight: 900; font-size: clamp(28px, 6vw, 44px); letter-spacing: -2px; line-height: 0.95; }

  .log-section {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
    padding: 24px; margin-bottom: 16px;
  }
  .log-section-title {
    font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    color: var(--red); text-transform: uppercase; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .log-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .rest-day-btn {
    width: 100%; background: transparent; border: 1px dashed var(--border);
    color: var(--muted); font-family: var(--mono); font-size: 12px; letter-spacing: 2px;
    padding: 16px; border-radius: 4px; cursor: pointer; text-transform: uppercase;
    transition: all 0.2s; margin-bottom: 16px;
  }
  .rest-day-btn:hover { border-color: var(--muted); color: var(--ink); }
  .rest-day-btn.selected { background: var(--bg2); border-color: var(--accent); border-style: solid; color: var(--ink); }

  .btn-submit {
    width: 100%; background: var(--ink); color: var(--accent);
    font-family: var(--display); font-weight: 900; font-size: 20px; letter-spacing: 1px;
    padding: 18px; border-radius: 4px; border: none; cursor: pointer;
    transition: all 0.2s; text-transform: uppercase; margin-top: 24px;
  }
  .btn-submit:hover { background: var(--ink2); }
  .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── AI RESPONSE ── */
  .ai-response {
    background: var(--ink); border-radius: 6px; padding: 28px; margin-top: 24px;
    display: none;
  }
  .ai-response.visible { display: block; }
  .ai-response-label {
    font-family: var(--mono); font-size: 10px; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase; margin-bottom: 20px;
    display: flex; align-items: center; gap: 8px;
  }
  .ai-response-label::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
  .ai-response-body { font-family: var(--mono); font-size: 13px; line-height: 1.9; color: rgba(245,242,235,0.85); }
  .ai-response-body h3 { font-family: var(--display); font-weight: 700; font-size: 16px; color: var(--accent); margin: 20px 0 8px; letter-spacing: -0.5px; }
  .ai-response-body h3:first-child { margin-top: 0; }
  .ai-response-body p { margin-bottom: 12px; }
  .ai-response-body ul { padding-left: 0; list-style: none; }
  .ai-response-body li { padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; gap: 10px; }
  .ai-response-body li::before { content: '✦'; color: var(--red); font-size: 9px; margin-top: 4px; flex-shrink: 0; }

  /* ── LOG HISTORY ── */
  .history-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
    padding: 20px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.2s;
  }
  .history-card:hover { border-color: var(--red); }
  .history-card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .history-date { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .history-km { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: -1px; color: var(--ink); }
  .history-pain {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .pain-dot { width: 8px; height: 8px; border-radius: 50%; }
  .pain-dot.low { background: var(--accent); }
  .pain-dot.mid { background: #ff9500; }
  .pain-dot.high { background: var(--red); }
  .pain-dot.none { background: var(--muted); }
  .history-notes { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.6; margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 24px; }
  .empty-icon { font-size: 40px; margin-bottom: 16px; }
  .empty-title { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -1px; margin-bottom: 8px; }
  .empty-sub { font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.7; }

  .section-divider { font-family: var(--mono); font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; margin: 28px 0 16px; display: flex; align-items: center; gap: 12px; }
  .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* ── STATS STRIP ── */
  .stats-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 24px; }
  .stat-box { background: var(--bg2); padding: 16px; text-align: center; }
  .stat-val { font-family: var(--display); font-weight: 900; font-size: 24px; letter-spacing: -1px; color: var(--ink); }
  .stat-key { font-family: var(--mono); font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-top: 4px; }

  /* ── PREMIUM BLUEPRINT ── */
  .bp-wrap { padding-bottom: 40px; }
  .bp-hero {
    background: var(--ink); border-radius: 8px;
    padding: 28px; margin-bottom: 16px; position: relative; overflow: hidden;
  }
  .bp-hero::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--red), var(--accent));
  }
  .bp-hero-tag {
    font-family: var(--mono); font-size: 9px; letter-spacing: 3px;
    color: var(--accent); text-transform: uppercase; margin-bottom: 10px;
  }
  .bp-hero-name {
    font-family: var(--display); font-weight: 900;
    font-size: clamp(28px, 6vw, 44px); letter-spacing: -2px;
    color: white; line-height: 1; margin-bottom: 10px;
  }
  .bp-hero-name .ai { color: var(--red); }
  .bp-hero-tagline {
    font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,0.6);
    line-height: 1.6; margin-bottom: 16px;
  }
  .bp-focus-pill {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(200,242,58,0.12); border: 1px solid rgba(200,242,58,0.3);
    border-radius: 20px; padding: 6px 14px;
    font-family: var(--mono); font-size: 11px; color: var(--accent);
  }

  .bp-section { margin-bottom: 16px; }
  .bp-section-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: 3px;
    color: var(--red); text-transform: uppercase; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .bp-section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Injury alert */
  .bp-injury {
    border-radius: 8px; padding: 20px; margin-bottom: 16px;
    border-left: 4px solid var(--red); background: var(--bg2);
  }
  .bp-injury-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bp-injury-badge {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    text-transform: uppercase; padding: 3px 8px; border-radius: 3px;
    background: var(--red); color: white;
  }
  .bp-injury-title {
    font-family: var(--display); font-weight: 700; font-size: 16px;
    letter-spacing: -0.5px; color: var(--ink);
  }
  .bp-injury-desc {
    font-family: var(--mono); font-size: 12px; color: var(--ink2);
    line-height: 1.7; margin-bottom: 12px;
  }
  .bp-rules { list-style: none; }
  .bp-rules li {
    font-family: var(--mono); font-size: 11px; line-height: 1.6;
    padding: 6px 0; border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; gap: 8px;
  }
  .bp-rules li:last-child { border-bottom: none; }
  .bp-rule-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
  }
  .bp-rule-dot.green { background: #22c55e; }
  .bp-rule-dot.amber { background: #f59e0b; }
  .bp-rule-dot.red { background: var(--red); }

  /* Weekly grid */
  .bp-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  @media (max-width: 600px) { .bp-week { grid-template-columns: repeat(4, 1fr); } }
  .bp-day {
    border-radius: 6px; padding: 10px 6px; text-align: center;
    border: 1px solid var(--border); background: var(--bg2);
    transition: transform 0.2s;
  }
  .bp-day:hover { transform: translateY(-2px); }
  .bp-day-name {
    font-family: var(--mono); font-size: 9px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase; margin-bottom: 6px;
  }
  .bp-day-icon { font-size: 20px; margin-bottom: 6px; display: block; }
  .bp-day-type {
    font-family: var(--display); font-weight: 700; font-size: 9px;
    letter-spacing: -0.3px; color: var(--ink); margin-bottom: 4px;
    line-height: 1.2;
  }
  .bp-day-detail {
    font-family: var(--mono); font-size: 8px; color: var(--muted);
    line-height: 1.4;
  }
  .bp-day.green { border-top: 3px solid #22c55e; }
  .bp-day.yellow { border-top: 3px solid #f59e0b; }
  .bp-day.orange { border-top: 3px solid #f97316; }
  .bp-day.blue { border-top: 3px solid #3b82f6; }
  .bp-day.gray { border-top: 3px solid var(--muted); }

  /* Exercises */
  .bp-exercise {
    background: var(--bg2); border-radius: 8px;
    padding: 16px; margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .bp-ex-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
  }
  .bp-ex-icon {
    width: 44px; height: 44px; border-radius: 8px;
    background: var(--ink); display: flex; align-items: center;
    justify-content: center; font-size: 22px; flex-shrink: 0;
  }
  .bp-ex-title {
    font-family: var(--display); font-weight: 700; font-size: 15px;
    letter-spacing: -0.5px; color: var(--ink); margin-bottom: 2px;
  }
  .bp-ex-sets {
    font-family: var(--mono); font-size: 11px; color: var(--red);
    letter-spacing: 1px;
  }
  .bp-ex-why {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    line-height: 1.6; margin-bottom: 10px; font-style: italic;
  }
  .bp-ex-steps { list-style: none; margin-bottom: 8px; }
  .bp-ex-steps li {
    font-family: var(--mono); font-size: 11px; color: var(--ink2);
    line-height: 1.6; padding: 4px 0;
    display: flex; align-items: flex-start; gap: 8px;
    border-bottom: 1px solid var(--border);
  }
  .bp-ex-steps li:last-child { border-bottom: none; }
  .bp-ex-step-num {
    background: var(--ink); color: var(--accent);
    font-family: var(--display); font-weight: 700; font-size: 9px;
    width: 18px; height: 18px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .bp-ex-cue {
    background: rgba(200,242,58,0.1); border-left: 3px solid var(--accent);
    padding: 6px 10px; border-radius: 0 4px 4px 0;
    font-family: var(--mono); font-size: 10px; color: var(--ink2);
  }

  /* Milestones */
  .bp-milestones { display: flex; flex-direction: column; gap: 8px; }
  .bp-milestone {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px; background: var(--bg2); border-radius: 8px;
    border: 1px solid var(--border);
  }
  .bp-milestone-period {
    font-family: var(--display); font-weight: 900; font-size: 11px;
    color: white; background: var(--ink); padding: 4px 8px;
    border-radius: 4px; white-space: nowrap; flex-shrink: 0; margin-top: 2px;
    min-width: 68px; text-align: center;
  }
  .bp-milestone-target {
    font-family: var(--display); font-weight: 700; font-size: 13px;
    letter-spacing: -0.3px; color: var(--ink); margin-bottom: 2px;
  }
  .bp-milestone-focus {
    font-family: var(--mono); font-size: 10px; color: var(--muted);
  }
  .bp-milestone:last-child .bp-milestone-period {
    background: var(--red);
  }

  /* Daily habit */
  .bp-habit {
    background: var(--ink); border-radius: 8px; padding: 20px;
    border-top: 4px solid var(--accent);
  }
  .bp-habit-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .bp-habit-title {
    font-family: var(--display); font-weight: 700; font-size: 16px;
    letter-spacing: -0.5px; color: white;
  }
  .bp-habit-duration {
    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    color: var(--accent); text-transform: uppercase;
  }
  .bp-habit-desc {
    font-family: var(--mono); font-size: 12px; color: rgba(255,255,255,0.7);
    line-height: 1.7; margin-bottom: 8px;
  }
  .bp-habit-why {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    font-style: italic;
  }

  .multiselect-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  }
  @media (max-width: 480px) { .multiselect-grid { grid-template-columns: 1fr; } }
  .multiselect-option {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg2);
    cursor: pointer; transition: all 0.15s;
    font-family: var(--mono); font-size: 11px; color: var(--ink2);
    user-select: none;
  }
  .multiselect-option:hover { border-color: var(--red); }
  .multiselect-option.selected { background: var(--ink); color: white; border-color: var(--ink); }
  .multiselect-option.selected .ms-check { background: var(--accent); border-color: var(--accent); }
  .ms-check {
    width: 16px; height: 16px; border-radius: 3px;
    border: 1.5px solid var(--border); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; transition: all 0.15s;
  }
  .q-subtitle {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    line-height: 1.6; margin-bottom: 24px; margin-top: -16px;
  }

  /* ── PUSH MODE ── */
  .push-mode-bar {
    border-radius: 8px; padding: 14px 16px;

  }
  .push-mode-bar.locked {
    background: var(--bg2); border: 1px solid var(--border);
  }
  .push-mode-bar.unlocked {
    background: var(--ink); border: 1px solid var(--accent);
  }
  .push-mode-bar.active {
    background: var(--ink);
    border: 2px solid var(--accent);
    box-shadow: 0 0 20px rgba(200,242,58,0.15);
  }
  .push-mode-top {
    display: flex; align-items: center; justify-content: space-between;

    font-family: var(--mono); font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .push-mode-bar.locked .push-mode-label { color: var(--muted); }
  .push-mode-bar.unlocked .push-mode-label { color: var(--accent); }
  .push-mode-bar.active .push-mode-label { color: var(--accent); }
  .push-mode-count {
    font-family: var(--display); font-weight: 900; font-size: 13px;
  }
  .push-mode-bar.locked .push-mode-count { color: var(--muted); }
  .push-mode-bar.unlocked .push-mode-count { color: var(--accent); }
  .push-mode-bar.active .push-mode-count { color: var(--accent); }
  .push-progress-track {
    height: 4px; background: rgba(0,0,0,0.1); border-radius: 2px;
    overflow: hidden; margin-bottom: 8px;
  }
  .push-mode-bar.locked .push-progress-track { background: rgba(0,0,0,0.06); }
  .push-mode-bar.unlocked .push-progress-track,
  .push-mode-bar.active .push-progress-track { background: rgba(255,255,255,0.1); }
  .push-progress-fill {
    height: 100%; border-radius: 2px;
    transition: width 0.5s ease;
  }
  .push-mode-bar.locked .push-progress-fill { background: var(--muted); }
  .push-mode-bar.unlocked .push-progress-fill { background: var(--accent); }
  .push-mode-bar.active .push-progress-fill { background: var(--accent); }
  .push-mode-desc {
    font-family: var(--mono); font-size: 11px; line-height: 1.5;
  }
  .push-mode-bar.locked .push-mode-desc { color: var(--muted); }
  .push-mode-bar.unlocked .push-mode-desc { color: rgba(255,255,255,0.7); }
  .push-mode-bar.active .push-mode-desc { color: rgba(255,255,255,0.7); }
  .push-toggle {
    display: flex; align-items: center; gap: 10px;
    margin-top: 10px; cursor: pointer;
  }
  .push-toggle-switch {
    width: 40px; height: 22px; background: rgba(255,255,255,0.15);
    border-radius: 11px; position: relative; transition: background 0.2s;
    flex-shrink: 0;
  }

  .push-toggle-switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 16px; height: 16px; background: white; border-radius: 50%;
    transition: transform 0.2s;
  }
  .push-toggle-switch.on::after { transform: translateX(18px); }
  .push-toggle-label {
    font-family: var(--mono); font-size: 11px; color: rgba(255,255,255,0.8);
  }

  /* ── QUOTES ── */

function getTodayKey() {
  return new Date().toISOString().slice(0, 10); // YYYY-MM-DD
}

function getQuickCoachingsUsed() {
  const stored = JSON.parse(localStorage.getItem('gait_coaching_count') || '{}');
  const today = getTodayKey();
  return stored[today] || 0;
}

function incrementCoachingCount() {
  const stored = JSON.parse(localStorage.getItem('gait_coaching_count') || '{}');
  const today = getTodayKey();
  stored[today] = (stored[today] || 0) + 1;
  // Clean up old days
  Object.keys(stored).forEach(k => { if (k !== today) delete stored[k]; });
  localStorage.setItem('gait_coaching_count', JSON.stringify(stored));
}

function getCoachingsRemaining() {
  return Math.max(0, MAX_QUICK_COACHINGS - getQuickCoachingsUsed());
}

function renderQ() {
  const container = document.getElementById('q-container');

  if (blueprint) {
    renderBlueprint();
    return;
  }

  const step = steps[currentStep];
  let html = `<div class="q-progress">`;
  steps.forEach((_, i) => {
    html += `<div class="q-progress-bar ${i < currentStep ? 'done' : i === currentStep ? 'active' : ''}"></div>`;
  });
  html += `</div>`;
  html += `<div class="q-label">${step.label}</div>`;
  html += `<h1 class="q-title">${step.title}</h1>`;
  if (step.subtitle) html += `<p class="q-subtitle">${step.subtitle}</p>`;

  step.fields.forEach(f => {
    const optionalTag = f.required === false ? ' <span style="color:var(--muted);font-size:9px;letter-spacing:1px;">OPTIONAL</span>' : '';
    html += `<div class="field"><label>${f.label}${optionalTag}</label>`;

    if (f.type === 'select') {
      html += `<select id="q_${f.key}" onchange="answers['${f.key}']=this.value">
        <option value="">Select...</option>
        ${f.options.map(o => `<option value="${o}" ${answers[f.key] === o ? 'selected' : ''}>${o}</option>`).join('')}
      </select>`;
    } else if (f.type === 'textarea') {
      html += `<textarea id="q_${f.key}" placeholder="${f.placeholder || ''}" oninput="answers['${f.key}']=this.value">${answers[f.key] || ''}</textarea>`;
    } else if (f.type === 'multiselect') {
      const selected = answers[f.key] ? answers[f.key].split('|') : [];
      html += `<div class="multiselect-grid" id="ms_${f.key}">`;
      f.options.forEach(o => {
        const isSelected = selected.includes(o);
        html += `<div class="multiselect-option ${isSelected ? 'selected' : ''}" onclick="toggleMultiselect('${f.key}', '${o.replace(/'/g, "\\'")}', this)">
          <div class="ms-check">${isSelected ? '✓' : ''}</div>
          <span>${o}</span>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<input type="${f.type}" id="q_${f.key}" placeholder="${f.placeholder || ''}" value="${answers[f.key] || ''}" oninput="answers['${f.key}']=this.value">`;
    }
    html += `</div>`;
  });

  html += `<div class="btn-row">`;
  if (currentStep > 0) html += `<button class="btn-back" onclick="prevStep()">← Back</button>`;
  html += `<button class="btn-next" id="next-btn" onclick="nextStep()">
    ${currentStep === steps.length - 1 ? 'Continue →' : 'Continue →'}
  </button></div>`;

  container.innerHTML = html;
}

function toggleMultiselect(key, value, el) {
  let selected = answers[key] ? answers[key].split('|') : [];
  const check = el.querySelector('.ms-check');
  if (selected.includes(value)) {
    selected = selected.filter(v => v !== value);
    el.classList.remove('selected');
    check.textContent = '';
  } else {
    selected.push(value);
    el.classList.add('selected');
    check.textContent = '✓';
  }
  answers[key] = selected.join('|');
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderQ();
    window.scrollTo(0, 0);
  }
}

function nextStep() {
  const step = steps[currentStep];
  const requiredFields = step.fields.filter(f => f.required !== false);
  const allFilled = requiredFields.every(f => answers[f.key]?.toString().trim());
  if (!allFilled) {
    alert('Please fill in all required fields before continuing.');
    return;
  }
  if (currentStep < steps.length - 1) {
    currentStep++;
    renderQ();
    window.scrollTo(0, 0);
  } else {
    showEmailCapture();
  }
}

async function captureEmailAndGenerate() {
  const email = document.getElementById('capture-email').value;
  const newsletter = document.getElementById('newsletter-opt').checked;

  if (!email || !email.includes('@')) {
    alert('Please enter a valid email address.');
    return;
  }

  answers.email = email;
  answers.newsletterOptIn = newsletter;

  // Store email in localStorage for reference
  const signups = JSON.parse(localStorage.getItem('gait_signups') || '[]');
  signups.push({
    date: new Date().toISOString(),
    email,
    newsletter,
    name: answers.name,
    goal: answers.raceGoal
  });
  localStorage.setItem('gait_signups', JSON.stringify(signups));

  // Send to secure backend which calls Airtable
  try {
    await fetch('/api/signup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: answers.name || '',
        email,
        newsletter,
        goal: answers.raceGoal || '',
        injuries: answers.injuries || '',
        terrain: answers.terrain || ''
      })
    });
  } catch (e) {
    // Fail silently — don't block blueprint generation
  }

  generateBlueprint();
}

let currentRoutineTime = 15;

function setRoutineTime(mins, btn) {
  currentRoutineTime = mins;
  // Update buttons
  btn.parentElement.querySelectorAll('button').forEach(b => {
    b.style.background = 'transparent';
    b.style.color = 'var(--muted)';
  });
  btn.style.background = 'var(--ink)';
  btn.style.color = 'var(--accent)';
  renderMorningRoutineContent();
}

function renderMorningRoutineContent() {
  const b = typeof blueprint === 'string' ? JSON.parse(blueprint) : blueprint;
  if (!b?.morningRoutine) return;
  const container = document.getElementById('morning-routine-content');
  if (!container) return;

  // Determine how many movements to show based on time
  const spineItems = b.morningRoutine.spineSection || [];
  const hipItems = b.morningRoutine.hipSection || [];
  const activationItems = b.morningRoutine.activationSection || [];

  let spineCount, hipCount, activationCount;
  if (currentRoutineTime === 15) {
    spineCount = 1; hipCount = 2; activationCount = 2;
  } else if (currentRoutineTime === 30) {
    spineCount = 2; hipCount = 3; activationCount = 3;
  } else {
    spineCount = spineItems.length; hipCount = hipItems.length; activationCount = activationItems.length;
  }

  let html = '';
  if (b.morningRoutine.note) {
    html += `<div style="background:rgba(255,61,46,0.08);border-left:3px solid var(--red);padding:8px 12px;border-radius:0 4px 4px 0;font-family:var(--mono);font-size:11px;color:var(--red);margin-bottom:14px;">⚠️ ${b.morningRoutine.note}</div>`;
  }

  if (spineItems.slice(0, spineCount).length) {
    html += `<div style="font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--red);text-transform:uppercase;margin-bottom:8px;">Spine & back</div>`;
    html += spineItems.slice(0, spineCount).map(m => renderRoutineItem(m, false)).join('');
  }
  if (hipItems.slice(0, hipCount).length) {
    html += `<div style="font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--red);text-transform:uppercase;margin:12px 0 8px;">Hip & joint mobility</div>`;
    html += hipItems.slice(0, hipCount).map(m => renderRoutineItem(m, false)).join('');
  }
  if (activationItems.slice(0, activationCount).length) {
    html += `<div style="font-family:var(--mono);font-size:9px;letter-spacing:2px;color:var(--red);text-transform:uppercase;margin:12px 0 8px;">Activation</div>`;
    html += activationItems.slice(0, activationCount).map(m => renderRoutineItem(m, false)).join('');
  }

  container.innerHTML = html;
}

let pushModeActive = JSON.parse(localStorage.getItem('gait_push_active') || 'false');

function getPainFreeDays() {
  if (logs.length === 0) return 0;
  let count = 0;
  const sorted = [...logs].sort((a, b) => new Date(b.date) - new Date(a.date));
  for (const log of sorted) {
    const pain = parseInt(log.painScore) || 0;
    if (pain <= 1) count++;
    else break;
  }
  return count;
}

function isPushModeUnlocked() {
  return getPainFreeDays() >= 28;
}

function renderPushModeBar() {
  const bar = document.getElementById('push-mode-bar');
  if (!bar) return;

  const painFreeDays = getPainFreeDays();
  const unlocked = painFreeDays >= 28;
  const pct = Math.min(100, (painFreeDays / 28) * 100);

  if (!unlocked) {
    pushModeActive = false;
    localStorage.setItem('gait_push_active', 'false');
    bar.innerHTML = `
      <div class="push-mode-bar locked">

function calcPace() {
  const km = parseFloat(document.getElementById('log-km').value);
  const timeStr = document.getElementById('log-time').value;
  if (!km || !timeStr) return;
  const parts = timeStr.split(':');
  if (parts.length !== 2) return;
  const totalMins = parseInt(parts[0]) + parseInt(parts[1]) / 60;
  if (!totalMins || km === 0) return;
  const paceMin = Math.floor(totalMins / km);
  const paceSec = Math.round(((totalMins / km) - paceMin) * 60);
  document.getElementById('log-pace').value = `${paceMin}:${paceSec.toString().padStart(2, '0')}`;
}

}

      todayLog.aiResponse = text;

function formatAIResponse(text) {
  return text
    .replace(/### (.+)/g, '<h3>$1</h3>')
    .replace(/## (.+)/g, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^- (.+)/gm, '<li>$1</li>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^(?!<[hl])/gm, '')
    .split('\n').map(line => {
      if (line.startsWith('<h') || line.startsWith('<li') || line === '') return line;
      return `<p>${line}</p>`;
    }).join('');
}

  } catch(e) {}
  return formatAIResponse(raw);
}

      ${log.notes ? `<div class="history-notes" style="margin-top:6px;">${log.notes.substring(0, 100)}${log.notes.length > 100 ? '...' : ''}</div>` : ''}
    </div>
    <div class="expanded-log" id="expanded-${logs.length - 1 - i}">
      ${log.aiResponse ? `<div class="ai-response visible" style="margin-bottom:16px;">

function updateStats() {
  const runs = logs.filter(l => !l.isRestDay);
  const totalKm = runs.reduce((s, l) => s + parseFloat(l.km || 0), 0);
  document.getElementById('stat-runs').textContent = runs.length;
  document.getElementById('stat-km').textContent = totalKm.toFixed(1);
  // Streak
  let streak = 0;
  const today = new Date().toDateString();
  for (let i = logs.length - 1; i >= 0; i--) {
    const d = new Date(logs[i].date);
    const expected = new Date();
    expected.setDate(expected.getDate() - streak);
    if (d.toDateString() === expected.toDateString()) streak++;
    else break;
  }
  document.getElementById('stat-streak').textContent = streak;
}

function parseMarkdown(text) {
  const lines = text.split('\n');
  const sections = [];
  let current = null;
  for (const line of lines) {
    if (line.startsWith('## ')) {
      if (current) sections.push(current);
      current = { heading: line.replace('## ', ''), content: '' };
    } else if (current) {
      if (line.startsWith('- ') || line.startsWith('• ')) {
        current.content += `<ul><li>${line.replace(/^[-•]\s/, '')}</li></ul>`;
      } else if (line.trim()) {
        current.content += `<p>${line}</p>`;
      }
    }
  }
  if (current) sections.push(current);
  return sections;
}

function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`view-${name}`).classList.add('active');
  event.target.classList.add('active');
  if (name === 'history') { renderHistory(); renderHistoryCharts(); }
  if (name === 'log') renderPushModeBar();
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>

// ══════════════════════════════════════════
// CHART HELPERS
// ══════════════════════════════════════════

// Shared chart defaults
Chart.defaults.color = 'rgba(255,255,255,0.75)';
Chart.defaults.font.family = "'DM Mono', monospace";
Chart.defaults.font.size = 10;

const CHART_GRID = { color: 'rgba(255,255,255,0.06)', drawBorder: false };
const CHART_ACCENT = '#c8f23a';
const CHART_RED = '#ff3d2e';
const CHART_AMBER = '#f5a623';

// Pain score → colour
function painColor(score) {
  if (score <= 2) return '#4ade80';
  if (score <= 4) return CHART_AMBER;
  return CHART_RED;
}

// Get last N days as labels
function lastNDays(n) {
  return Array.from({length: n}, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() - (n - 1 - i));
    return d.toISOString().slice(0, 10);
  });
}

// Get ISO week string YYYY-WNN
function isoWeek(dateStr) {
  const d = new Date(dateStr);
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return `${d.getFullYear()}-W${String(week).padStart(2, '0')}`;
}

// Short week label e.g. "Mar 24"
function weekLabel(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

// ══════════════════════════════════════════
// PAIN TREND CHART (full - 30 days)
// ══════════════════════════════════════════
function renderPainChart(canvasId, days) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  const dayKeys = lastNDays(days);
  const logMap = {};
  logs.forEach(l => {
    const key = l.date ? l.date.slice(0, 10) : null;
    if (key) logMap[key] = parseInt(l.painScore) || 0;
  });

  const scores = dayKeys.map(k => logMap[k] !== undefined ? logMap[k] : null);
  const labels = dayKeys.map(k => {
    const d = new Date(k);
    return d.getDate() + '/' + (d.getMonth() + 1);
  });

  // Point colours based on score
  const pointColors = scores.map(s => s === null ? 'transparent' : painColor(s));

  // Destroy existing if any
  if (canvas._chartInstance) canvas._chartInstance.destroy();

  canvas._chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data: scores,
        borderColor: CHART_ACCENT,
        borderWidth: 2,
        pointBackgroundColor: pointColors,
        pointBorderColor: pointColors,
        pointRadius: scores.map(s => s === null ? 0 : 4),
        tension: 0.3,
        spanGaps: true,
        fill: false
      }]
    },
    options: {
      responsive: true,
      animation: false,
      plugins: {
        legend: { display: false },
        annotation: { annotations: {} },
        tooltip: {
          callbacks: {
            label: ctx => `Pain: ${ctx.parsed.y}/10`
          }
        }
      },
      scales: {
        x: { grid: CHART_GRID, ticks: { maxTicksLimit: 8, maxRotation: 0 } },
        y: {
          grid: CHART_GRID,
          min: 0, max: 10,
          ticks: { stepSize: 2 },
          afterDataLimits(scale) {}
        }
      }
    },
    plugins: [{
      id: 'warningLine',
      afterDraw(chart) {
        const { ctx, chartArea, scales } = chart;
        const y = scales.y.getPixelForValue(3);
        ctx.save();
        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = CHART_AMBER;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(chartArea.left, y);
        ctx.lineTo(chartArea.right, y);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.font = '9px DM Mono, monospace';
        ctx.fillStyle = CHART_AMBER;
        ctx.fillText('Warning zone', chartArea.right - 82, y - 4);
        ctx.restore();
      }
    }]
  });
}

// ══════════════════════════════════════════
// WEEKLY MILEAGE CHART
// ══════════════════════════════════════════
function renderMileageChart() {
  const canvas = document.getElementById('chart-mileage');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // Build weekly totals — last 8 weeks
  const weekMap = {};
  const weekOrder = [];
  const today = new Date();

  for (let w = 7; w >= 0; w--) {
    const d = new Date(today);
    d.setDate(today.getDate() - w * 7);
    const key = isoWeek(d.toISOString().slice(0, 10));
    const startOfWeek = new Date(d);
    startOfWeek.setDate(d.getDate() - d.getDay() + 1);
    if (!weekMap[key]) {
      weekMap[key] = { km: 0, label: weekLabel(startOfWeek.toISOString().slice(0, 10)) };
      weekOrder.push(key);
    }
  }

  logs.forEach(l => {
    if (l.isRestDay || l.mode === 'rest' || l.mode === 'body') return;
    const key = l.date ? isoWeek(l.date.slice(0, 10)) : null;
    if (key && weekMap[key] !== undefined) {
      weekMap[key].km += parseFloat(l.km) || 0;
    }
  });

  const currentWeekKey = isoWeek(today.toISOString().slice(0, 10));
  const labels = weekOrder.map(k => weekMap[k].label);
  const data = weekOrder.map(k => Math.round(weekMap[k].km * 10) / 10);
  const colors = weekOrder.map(k => k === currentWeekKey ? CHART_ACCENT : 'rgba(200,242,58,0.35)');

  // Safe increase line — 10% per week from first non-zero
  let safeKm = null;
  const safeLine = data.map(km => {
    if (safeKm === null && km > 0) { safeKm = km; return km; }
    if (safeKm !== null) { safeKm = safeKm * 1.1; return Math.round(safeKm * 10) / 10; }
    return null;
  });

  if (canvas._chartInstance) canvas._chartInstance.destroy();

  canvas._chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          data,
          backgroundColor: colors,
          borderRadius: 4,
          barPercentage: 0.7
        },
        {
          type: 'line',
          data: safeLine,
          borderColor: 'rgba(255,255,255,0.2)',
          borderDash: [4, 4],
          borderWidth: 1,
          pointRadius: 0,
          fill: false,
          tension: 0
        }
      ]
    },
    options: {
      responsive: true,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.datasetIndex === 0 ? `${ctx.parsed.y} km` : `Safe max: ${ctx.parsed.y} km`
          }
        }
      },
      scales: {
        x: { grid: CHART_GRID },
        y: { grid: CHART_GRID, min: 0, ticks: { callback: v => v + 'km' } }
      }
    }
  });
}

// ══════════════════════════════════════════
// CONSISTENCY CHART
// ══════════════════════════════════════════
function renderConsistencyChart() {
  const canvas = document.getElementById('chart-consistency');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');

  // Runs per week this month + last month
  const weekMap = {};
  const weekOrder = [];
  const today = new Date();

  for (let w = 7; w >= 0; w--) {
    const d = new Date(today);
    d.setDate(today.getDate() - w * 7);
    const key = isoWeek(d.toISOString().slice(0, 10));
    const startOfWeek = new Date(d);
    startOfWeek.setDate(d.getDate() - d.getDay() + 1);
    if (!weekMap[key]) {
      weekMap[key] = { runs: 0, label: weekLabel(startOfWeek.toISOString().slice(0, 10)) };
      weekOrder.push(key);
    }
  }

  logs.forEach(l => {
    if (l.isRestDay || l.mode === 'rest' || l.mode === 'body') return;
    const key = l.date ? isoWeek(l.date.slice(0, 10)) : null;
    if (key && weekMap[key] !== undefined) weekMap[key].runs++;
  });

  const currentWeekKey = isoWeek(today.toISOString().slice(0, 10));
  const labels = weekOrder.map(k => weekMap[k].label);
  const data = weekOrder.map(k => weekMap[k].runs);
  const colors = weekOrder.map(k => k === currentWeekKey ? CHART_ACCENT : 'rgba(200,242,58,0.35)');

  if (canvas._chartInstance) canvas._chartInstance.destroy();

  canvas._chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colors,
        borderRadius: 4,
        barPercentage: 0.7
      }]
    },
    options: {
      responsive: true,
      animation: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => `${ctx.parsed.y} runs` } }
      },
      scales: {
        x: { grid: CHART_GRID },
        y: { grid: CHART_GRID, min: 0, max: 7, ticks: { stepSize: 1, callback: v => v + 'd' } }
      }
    }
  });
}

// ══════════════════════════════════════════
// ACWR GAUGE (blueprint tab)
// ══════════════════════════════════════════
function renderACWR() {
  const el = document.getElementById('bp-acwr-gauge');
  if (!el) return;

  // Acute = last 7 days km, Chronic = avg of last 28 days (4 week avg)
  const today = new Date();
  let acute = 0, chronic28 = 0, week = [0,0,0,0];

  logs.forEach(l => {
    if (l.isRestDay || l.mode === 'rest' || l.mode === 'body') return;
    const km = parseFloat(l.km) || 0;
    const daysAgo = Math.floor((today - new Date(l.date)) / 86400000);
    if (daysAgo < 7) acute += km;
    if (daysAgo < 28) {
      chronic28 += km;
      const weekIdx = Math.floor(daysAgo / 7);
      if (weekIdx < 4) week[weekIdx] += km;
    }
  });

  const avgWeekly = chronic28 / 4;
  const ratio = avgWeekly > 0 ? Math.round((acute / avgWeekly) * 100) / 100 : null;

  let color, status, advice;
  if (ratio === null || avgWeekly === 0) {
    color = 'rgba(255,255,255,0.3)'; status = 'Not enough data'; advice = 'Log more runs to see your load ratio';
  } else if (ratio < 0.8) {
    color = 'rgba(255,255,255,0.4)'; status = 'Under-trained'; advice = 'Safe to gradually increase load this week';
  } else if (ratio <= 1.3) {
    color = '#4ade80'; status = 'Optimal zone'; advice = 'Your training load is well balanced';
  } else if (ratio <= 1.5) {
    color = CHART_AMBER; status = 'Caution'; advice = 'Load is elevated — monitor closely this week';
  } else {
    color = CHART_RED; status = 'High injury risk'; advice = 'Reduce load immediately — take 1-2 easy days';
  }

  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
      <div>
        <div style="font-family:var(--mono);font-size:9px;letter-spacing:2px;color:rgba(255,255,255,0.4);text-transform:uppercase;margin-bottom:6px;">Acute:Chronic ratio</div>
        <div style="display:flex;align-items:baseline;gap:8px;">
          <div style="font-family:'Unbounded',sans-serif;font-weight:900;font-size:32px;color:${color};">${ratio !== null ? ratio.toFixed(2) : '—'}</div>
          <div style="font-family:var(--mono);font-size:12px;color:${color};">${status}</div>
        </div>
        <div style="font-family:var(--mono);font-size:11px;color:rgba(255,255,255,0.4);margin-top:6px;line-height:1.5;">${advice}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.3);margin-bottom:4px;">This week</div>
        <div style="font-family:'Unbounded',sans-serif;font-weight:700;font-size:18px;color:white;">${Math.round(acute * 10) / 10} km</div>
        <div style="font-family:var(--mono);font-size:10px;color:rgba(255,255,255,0.3);margin-top:4px;">4wk avg: ${Math.round(avgWeekly * 10) / 10} km/wk</div>
      </div>
    </div>
    <div style="display:flex;gap:4px;margin-top:12px;">
      <div style="flex:1;height:4px;background:#4ade80;border-radius:2px;opacity:${ratio !== null && ratio >= 0.8 && ratio <= 1.3 ? 1 : 0.25};"></div>
      <div style="flex:1;height:4px;background:${CHART_AMBER};border-radius:2px;opacity:${ratio !== null && ratio > 1.3 && ratio <= 1.5 ? 1 : 0.25};"></div>
      <div style="flex:1;height:4px;background:${CHART_RED};border-radius:2px;opacity:${ratio !== null && ratio > 1.5 ? 1 : 0.25};"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:rgba(255,255,255,0.25);margin-top:4px;">
      <span>0.8 — Optimal</span><span>1.3 — Caution</span><span>1.5 — Risk</span>
    </div>`;
}

// ══════════════════════════════════════════
// RENDER ALL HISTORY CHARTS
// ══════════════════════════════════════════
function renderHistoryCharts() {
  if (typeof Chart === 'undefined') {
    setTimeout(renderHistoryCharts, 100);
    return;
  }
  setTimeout(() => {
    renderPainChart('chart-pain', 30);
    renderMileageChart();
    renderConsistencyChart();
  }, 50);
}

// ══════════════════════════════════════════
// RENDER BLUEPRINT CHARTS
// ══════════════════════════════════════════
function renderBlueprintCharts() {
  if (typeof Chart === 'undefined') {
    setTimeout(renderBlueprintCharts, 100);
    return;
  }
  setTimeout(() => {
    renderPainChart('chart-pain-mini', 14);
    renderACWR();
  }, 50);
}
