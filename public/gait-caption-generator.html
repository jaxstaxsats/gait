<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIT Caption + Visual Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --bg:#0a0908;--bg2:#111009;--bg3:#181610;--border:rgba(255,255,255,0.08);--accent:#c8f23a;--red:#ff3d2e;--ink:#0f0e0b;--muted:rgba(255,255,255,0.35);--body:rgba(255,255,255,0.7);--mono:'DM Mono',monospace;--display:'Unbounded',sans-serif; }
  body { background:var(--bg);color:white;font-family:var(--mono);min-height:100vh;padding:40px 24px; }
  body::before { content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 15% 10%,rgba(200,242,58,0.05) 0%,transparent 45%),radial-gradient(ellipse at 85% 90%,rgba(255,61,46,0.03) 0%,transparent 40%); }
  .container { max-width:720px;margin:0 auto;position:relative;z-index:1; }
  .header { display:flex;align-items:center;justify-content:space-between;margin-bottom:40px; }
  .logo { font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:-1px;color:white; }
  .logo .ai { color:var(--red); }
  .header-tag { font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase; }
  .section { background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:16px; }
  .section-title { font-size:9px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:16px; }
  .pillar-grid { display:grid;grid-template-columns:repeat(3,1fr);gap:8px; }
  .pillar-btn { padding:12px 8px;border:1px solid var(--border);border-radius:6px;background:transparent;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;text-align:center;transition:all 0.15s;line-height:1.5; }
  .pillar-btn:hover { border-color:var(--accent);color:white; }
  .pillar-btn.active { border-color:var(--accent);background:rgba(200,242,58,0.08);color:var(--accent); }
  .pillar-icon { font-size:16px;display:block;margin-bottom:4px; }
  .topic-grid { display:flex;flex-wrap:wrap;gap:8px; }
  .topic-btn { padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;transition:all 0.15s; }
  .topic-btn:hover { border-color:var(--accent);color:white; }
  .topic-btn.active { background:var(--accent);border-color:var(--accent);color:var(--ink); }
  .field { margin-bottom:16px; }
  .field:last-child { margin-bottom:0; }
  .field label { display:block;font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:8px; }
  textarea { width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;padding:12px 14px;font-family:var(--mono);font-size:12px;color:white;resize:vertical;outline:none;transition:border-color 0.15s; }
  textarea:focus { border-color:rgba(200,242,58,0.4); }
  textarea::placeholder { color:rgba(255,255,255,0.2); }
  .tone-row { display:flex;gap:8px;flex-wrap:wrap; }
  .tone-btn { padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;transition:all 0.15s; }
  .tone-btn:hover { border-color:rgba(255,255,255,0.3);color:white; }
  .tone-btn.active { background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.3);color:white; }
  .generate-btn { width:100%;background:var(--accent);color:var(--ink);font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:18px;border-radius:6px;border:none;cursor:pointer;transition:all 0.2s;margin-bottom:16px; }
  .generate-btn:hover { transform:translateY(-1px);box-shadow:0 8px 24px rgba(200,242,58,0.2); }
  .generate-btn:disabled { opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none; }
  .loading-bar { display:none;align-items:center;gap:12px;padding:14px 16px;background:rgba(200,242,58,0.06);border:1px solid rgba(200,242,58,0.12);border-radius:6px;margin-bottom:16px; }
  .loading-bar.visible { display:flex; }
  .spinner { width:16px;height:16px;border:2px solid rgba(200,242,58,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-steps { display:flex;flex-direction:column;gap:4px; }
  .loading-step { font-size:10px;letter-spacing:1px;color:var(--muted); }
  .loading-step.active { color:var(--accent); }
  .loading-step.done { color:rgba(200,242,58,0.4); }
  .output { display:none; }
  .output.visible { display:block; }
  .out-section { background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:12px;position:relative; }
  .out-label { font-size:8px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:12px; }
  .caption-text { font-size:13px;color:var(--body);line-height:1.85;white-space:pre-wrap; }
  .hashtag-list { display:flex;flex-wrap:wrap;gap:8px; }
  .hashtag { font-size:11px;color:var(--accent);background:rgba(200,242,58,0.08);border:1px solid rgba(200,242,58,0.15);border-radius:20px;padding:4px 10px; }
  .copy-btn { position:absolute;top:16px;right:16px;padding:5px 12px;border:1px solid var(--border);border-radius:4px;background:transparent;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
  .copy-btn:hover { border-color:var(--accent);color:var(--accent); }
  .copy-btn.copied { color:var(--accent);border-color:var(--accent); }
  .visual-wrap { background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:12px; }
  .visual-header { display:flex;justify-content:space-between;align-items:center;margin-bottom:16px; }
  .visual-label { font-size:8px;letter-spacing:3px;color:var(--accent);text-transform:uppercase; }
  .dl-btn { padding:9px 20px;border:1px solid var(--accent);border-radius:4px;background:rgba(200,242,58,0.08);font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:1px;color:var(--accent);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
  .dl-btn:hover { background:rgba(200,242,58,0.18); }
  #post-canvas { width:100%;border-radius:6px; }
  .regen-btn { width:100%;padding:14px;border:1px solid var(--border);border-radius:6px;background:transparent;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);cursor:pointer;transition:all 0.15s;text-transform:uppercase;margin-top:4px; }
  .regen-btn:hover { border-color:var(--accent);color:var(--accent); }
  .error-msg { display:none;padding:14px 16px;background:rgba(255,61,46,0.08);border:1px solid rgba(255,61,46,0.2);border-radius:6px;font-size:11px;color:#ff6b5e;margin-bottom:16px; }
  .error-msg.visible { display:block; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">G<span class="ai">AI</span>T</div>
    <div class="header-tag">Caption + Visual · @gaitrun</div>
  </div>
  <div class="section">
    <div class="section-title">Content pillar</div>
    <div class="pillar-grid">
      <button class="pillar-btn active" onclick="setPillar('journey',this)"><span class="pillar-icon">🏃</span>Jax's Journey</button>
      <button class="pillar-btn" onclick="setPillar('howit',this)"><span class="pillar-icon">📱</span>How GAIT Works</button>
      <button class="pillar-btn" onclick="setPillar('education',this)"><span class="pillar-icon">🧠</span>Education</button>
    </div>
  </div>
  <div class="section">
    <div class="section-title">Topic</div>
    <div class="topic-grid" id="topic-grid"></div>
  </div>
  <div class="section">
    <div class="section-title">Context (optional)</div>
    <div class="field">
      <label>What happened / specific detail to include</label>
      <textarea id="ctx" rows="3" placeholder="e.g. Ran 8km this morning, groin felt tight at 5km but eased off. Pain 2/10 after..."></textarea>
    </div>
    <div class="field">
      <label>Tone</label>
      <div class="tone-row">
        <button class="tone-btn active" onclick="setTone('honest',this)">Honest & raw</button>
        <button class="tone-btn" onclick="setTone('educational',this)">Educational</button>
        <button class="tone-btn" onclick="setTone('motivating',this)">Quietly motivating</button>
        <button class="tone-btn" onclick="setTone('minimal',this)">Minimal</button>
      </div>
    </div>
  </div>
  <button class="generate-btn" id="gen-btn" onclick="generate()">Generate caption + visual →</button>
  <div class="loading-bar" id="loading-bar">
    <div class="spinner"></div>
    <div class="loading-steps">
      <div class="loading-step" id="step-1">Writing caption...</div>
      <div class="loading-step" id="step-2">Drawing visual...</div>
    </div>
  </div>
  <div class="error-msg" id="error-msg"></div>
  <div class="output" id="output">
    <div class="out-section">
      <div class="out-label">Caption</div>
      <button class="copy-btn" id="ccbtn" onclick="cp('caption-text','ccbtn')">Copy</button>
      <div class="caption-text" id="caption-text"></div>
    </div>
    <div class="out-section">
      <div class="out-label">Hashtags</div>
      <button class="copy-btn" id="hcbtn" onclick="cpTags()">Copy all</button>
      <div class="hashtag-list" id="hashtag-list"></div>
    </div>
    <div class="visual-wrap">
      <div class="visual-header">
        <div class="visual-label">Post visual — 1080 × 1350px</div>
        <button class="dl-btn" onclick="dlPNG()">↓ Download PNG</button>
      </div>
      <canvas id="post-canvas" width="1080" height="1350"></canvas>
    </div>
    <button class="regen-btn" onclick="generate()">↻ Regenerate</button>
  </div>
</div>
<script>
let PIL='journey',TOP='',TONE='honest',RES=null;
const TOPICS={
  journey:['102km month — biggest in 6 years','First run back after injury','Push Mode unlock — 28 pain-free days','Morning check-in on a pain day','Recovery day — following GAIT advice','Overload setback','Building GAIT while injured','6-year PFPS journey','Evening recovery routine','Vegan runner nutrition','Training for the ultra marathon'],
  howit:['Blueprint reveal','Injury selector — how it works','Strength circuit with time options','The coaching response explained','Push Mode feature','Multi-injury tracking','Mileage rules','First 100 users — €4.99/month forever'],
  education:["Runner's knee isn't a knee problem",'Why IT band stretching fails','Why rest alone doesn\'t fix injuries','The 10% mileage rule is wrong','Groin strain vs hip flexor','Why glute weakness causes knee pain','Lysine for vegan runners','Why overload hits multiple areas'],
};
function init(){renderTopics();}
function renderTopics(){
  const g=document.getElementById('topic-grid');
  g.innerHTML=TOPICS[PIL].map((t,i)=>`<button class="topic-btn${i===0?' active':''}" onclick="setTopic('${t.replace(/'/g,"\\'")}',this)">${t}</button>`).join('');
  TOP=TOPICS[PIL][0];
}
function setPillar(p,b){PIL=p;document.querySelectorAll('.pillar-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderTopics();document.getElementById('output').classList.remove('visible');}
function setTopic(t,b){TOP=t;document.querySelectorAll('.topic-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');}
function setTone(t,b){TONE=t;document.querySelectorAll('.tone-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');}
function buildPrompt(){
  const ctx=document.getElementById('ctx').value.trim();
  const tones={honest:'honest and raw — like a real runner texting a mate. Slightly tired sometimes. Real emotions.',educational:'informative and conversational — teach one thing, no jargon',motivating:'quietly motivating — not hype, like a friend who genuinely believes in you',minimal:'minimal — short, confident, let the numbers speak'};
  const pillars={journey:'First person as Jax. Open with the real moment or pain point, not the product. Mention GAIT naturally as what helped — never as a sales pitch.',howit:'Show a specific GAIT feature in action. Describe what the runner sees. Make it feel like a real product moment.',education:'Teach one specific thing about running injuries. Lead with the counter-intuitive truth. Practical and actionable.'};
  return `You write Instagram captions for @gaitrun — AI running coach for injury-prone runners.

Jax, 39, Porto Portugal, 6 years PFPS, ran 102km this month. Vegan. Desk job. Training for ultra 2027.
Currently managing: groin 3/10, right glute 3/10, lower back 2/10 after big month.
First 100 users: €4.99/month locked forever. After: €7.99/month.
Voice: warm, honest, direct. Like a knowledgeable friend. No hype. No fitness clichés.

PILLAR: ${pillars[PIL]}
TONE: ${tones[TONE]}
TOPIC: ${TOP}${ctx?'\nCONTEXT: '+ctx:''}

Caption rules: Strong scroll-stopping first line. 3-5 sentences. Subtle CTA at end (gait.run in bio or first 100 users €4.99/month). Max 1 emoji. No hashtags in body.

Respond ONLY with valid JSON, no backticks:
{"caption":"...","hashtags":["tag1","tag2","tag3","tag4","tag5","tag6","tag7","tag8"],"stat":"key number e.g. 102km","stat_label":"2-4 words","headline":"4-6 word punchy headline","subline":"one short supporting sentence","accent_word":"one word from headline to highlight lime green"}`;
}
async function generate(){
  const btn=document.getElementById('gen-btn');
  const loading=document.getElementById('loading-bar');
  const output=document.getElementById('output');
  const err=document.getElementById('error-msg');
  btn.disabled=true;loading.classList.add('visible');output.classList.remove('visible');err.classList.remove('visible');
  document.getElementById('step-1').className='loading-step active';
  document.getElementById('step-2').className='loading-step';
  try {
    const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:700,messages:[{role:'user',content:buildPrompt()}]})});
    const data=await res.json();
    const text=data.content?.[0]?.text;
    if(!text) throw new Error(data.error?.message||'No API response');
    let clean=text.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
    const f=clean.indexOf('{'),l=clean.lastIndexOf('}');
    if(f!==-1&&l!==-1) clean=clean.substring(f,l+1);
    RES=JSON.parse(clean);
    document.getElementById('caption-text').textContent=RES.caption;
    document.getElementById('hashtag-list').innerHTML=(RES.hashtags||[]).map(h=>`<span class="hashtag">${h.startsWith('#')?h:'#'+h}</span>`).join('');
    document.getElementById('step-1').className='loading-step done';
    document.getElementById('step-2').className='loading-step active';
    output.classList.add('visible');
    await drawPost(RES);
    document.getElementById('step-2').className='loading-step done';
  } catch(e){
    err.textContent=`Error: ${e.message}. Please try again.`;err.classList.add('visible');
  } finally {
    btn.disabled=false;loading.classList.remove('visible');
  }
}
async function drawPost(r){
  const canvas=document.getElementById('post-canvas');
  const ctx=canvas.getContext('2d');
  const W=1080,H=1350;
  await document.fonts.ready;
  ctx.clearRect(0,0,W,H);
  // BG
  ctx.fillStyle='#0a0908';ctx.fillRect(0,0,W,H);
  const g1=ctx.createRadialGradient(180,160,0,180,160,550);g1.addColorStop(0,'rgba(200,242,58,0.055)');g1.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
  const g2=ctx.createRadialGradient(900,1200,0,900,1200,450);g2.addColorStop(0,'rgba(255,61,46,0.04)');g2.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  // TOP BAR
  ctx.strokeStyle='rgba(255,255,255,0.06)';ctx.lineWidth=1;ln(ctx,0,108,W,108);
  ctx.font='400 22px "DM Mono"';ctx.fillStyle='rgba(255,255,255,0.22)';ctx.textAlign='left';ctx.fillText('06:47',56,74);
  // Logo
  ctx.font='900 34px "Unbounded"';
  const gW=ctx.measureText('G').width,aiW=ctx.measureText('AI').width,tW2=ctx.measureText('T').width;
  const lx=W/2-(gW+aiW+tW2)/2;
  ctx.textAlign='left';ctx.fillStyle='white';ctx.fillText('G',lx,76);ctx.fillStyle='#ff3d2e';ctx.fillText('AI',lx+gW,76);ctx.fillStyle='white';ctx.fillText('T',lx+gW+aiW,76);
  ctx.font='400 16px "DM Mono"';ctx.fillStyle='rgba(255,255,255,0.18)';ctx.textAlign='right';ctx.fillText('Daily Log',W-56,74);
  // DATE
  ctx.font='400 18px "DM Mono"';ctx.fillStyle='rgba(255,255,255,0.2)';ctx.textAlign='left';ctx.fillText('THURSDAY · 3 APRIL 2026',56,160);
  // STAT
  const stat=r.stat||'102km';
  ctx.font='900 168px "Unbounded"';ctx.fillStyle='#c8f23a';ctx.textAlign='left';ctx.fillText(stat,52,380);
  const sw=ctx.measureText(stat).width;ctx.strokeStyle='rgba(200,242,58,0.2)';ctx.lineWidth=2;ln(ctx,52,398,Math.min(52+sw,W-52),398);
  ctx.font='400 22px "DM Mono"';ctx.fillStyle='rgba(255,255,255,0.28)';ctx.fillText((r.stat_label||'').toUpperCase(),56,438);
  // DIVIDER
  ctx.fillStyle='#c8f23a';ctx.fillRect(56,474,52,3);
  // HEADLINE with accent
  drawHL(ctx,r.headline||TOP,r.accent_word||'',56,560,W-112,78);
  // SUBLINE
  ctx.font='400 24px "DM Mono"';ctx.fillStyle='rgba(255,255,255,0.45)';
  wrapTxt(ctx,r.subline||'',56,670,W-112,38);
  // PILLS
  const pills=[{l:'Groin',s:'3/10'},{l:'Hip / glute',s:'3/10'},{l:'Lower back',s:'2/10'}];
  let px=56;const py=810;ctx.font='400 19px "DM Mono"';
  for(const p of pills){
    const pw=ctx.measureText(p.l+'  '+p.s).width+48,ph=46;
    rr(ctx,px,py,pw,ph,23);ctx.fillStyle='rgba(255,61,46,0.07)';ctx.fill();ctx.strokeStyle='rgba(255,61,46,0.22)';ctx.lineWidth=1;ctx.stroke();
    ctx.beginPath();ctx.arc(px+18,py+ph/2,5,0,Math.PI*2);ctx.fillStyle='#ff3d2e';ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.fillText(p.l,px+30,py+ph/2+7);
    const lw2=ctx.measureText(p.l).width;ctx.fillStyle='#ff3d2e';ctx.font='500 19px "DM Mono"';ctx.fillText('  '+p.s,px+30+lw2,py+ph/2+7);ctx.font='400 19px "DM Mono"';
    px+=pw+12;if(px>W-200){px=56;}
  }
  // SESSION BOX
  rr(ctx,56,905,W-112,132,10);ctx.fillStyle='rgba(200,242,58,0.06)';ctx.fill();ctx.strokeStyle='rgba(200,242,58,0.12)';ctx.lineWidth=1;ctx.stroke();
  ctx.font='400 17px "DM Mono"';ctx.fillStyle='#c8f23a';ctx.textAlign='left';ctx.fillText("TODAY'S PLAN",80,948);
  ctx.font='700 26px "Unbounded"';ctx.fillStyle='white';ctx.fillText('Active Recovery Day',80,988);
  ctx.font='400 18px "DM Mono"';ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillText('20-min flat walk · 8 targeted movements · no running',80,1022);
  // BOTTOM
  ctx.strokeStyle='rgba(255,255,255,0.05)';ctx.lineWidth=1;ln(ctx,0,H-90,W,H-90);
  ctx.font='400 17px "DM Mono"';ctx.fillStyle='rgba(255,255,255,0.15)';ctx.textAlign='left';ctx.fillText('Real coaching when my body says slow down',56,H-52);
  ctx.fillStyle='rgba(200,242,58,0.4)';ctx.textAlign='right';ctx.fillText('@gaitrun · gait.run',W-56,H-52);
}
function ln(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function wrapTxt(c,txt,x,y,maxW,lh){if(!txt)return;const ws=txt.split(' ');let line='',cy=y;for(const w of ws){const t=line+(line?' ':'')+w;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,cy);line=w;cy+=lh;}else{line=t;}}if(line)c.fillText(line,x,cy);}
function drawHL(c,hl,aw,x,y,maxW,lh){
  c.font='900 68px "Unbounded"';
  const words=hl.split(' ');let cx=x,cy=y;const sp=c.measureText(' ').width;
  for(let i=0;i<words.length;i++){
    const w=words[i],ww=c.measureText(w).width;
    if(cx>x&&cx+ww>x+maxW){cx=x;cy+=lh;}
    const isA=w.toLowerCase().replace(/[^a-z]/g,'')===aw.toLowerCase().replace(/[^a-z]/g,'');
    c.fillStyle=isA?'#c8f23a':'white';c.fillText(w,cx,cy);
    cx+=ww+(i<words.length-1?sp:0);
  }
}
function dlPNG(){
  const canvas=document.getElementById('post-canvas');
  const t=TOP.replace(/[^a-z0-9]/gi,'_').toLowerCase();
  const a=document.createElement('a');a.download=`gaitrun_${t}_${Date.now()}.png`;a.href=canvas.toDataURL('image/png');a.click();
}
async function cp(id,bid){
  await navigator.clipboard.writeText(document.getElementById(id).textContent);
  const b=document.getElementById(bid);b.textContent='Copied ✓';b.classList.add('copied');setTimeout(()=>{b.textContent='Copy';b.classList.remove('copied');},2000);
}
async function cpTags(){
  const t=Array.from(document.querySelectorAll('.hashtag')).map(e=>e.textContent).join(' ');
  await navigator.clipboard.writeText(t);
  const b=document.getElementById('hcbtn');b.textContent='Copied ✓';b.classList.add('copied');setTimeout(()=>{b.textContent='Copy all';b.classList.remove('copied');},2000);
}
