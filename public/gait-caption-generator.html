<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAIT Caption + Visual Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root { --bg:#0a0908;--bg2:#111009;--bg3:#181610;--border:rgba(255,255,255,0.08);--accent:#c8f23a;--red:#ff3d2e;--ink:#0f0e0b;--muted:rgba(255,255,255,0.35);--body:rgba(255,255,255,0.7);--mono:'DM Mono',monospace;--display:'Unbounded',sans-serif; }
body { background:var(--bg);color:white;font-family:var(--mono);min-height:100vh;padding:40px 24px; }
body::before { content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at 15% 10%,rgba(200,242,58,0.05) 0%,transparent 45%),radial-gradient(ellipse at 85% 90%,rgba(255,61,46,0.03) 0%,transparent 40%); }
.wrap { max-width:720px;margin:0 auto;position:relative;z-index:1; }
.hdr { display:flex;align-items:center;justify-content:space-between;margin-bottom:40px; }
.logo { font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:-1px;color:white; }
.logo .ai { color:var(--red); }
.hdr-tag { font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase; }
.box { background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:24px;margin-bottom:16px; }
.box-title { font-size:9px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:16px; }
.pgrid { display:grid;grid-template-columns:repeat(3,1fr);gap:8px; }
.pbtn { padding:12px 8px;border:1px solid var(--border);border-radius:6px;background:transparent;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;text-align:center;transition:all 0.15s;line-height:1.5; }
.pbtn:hover,.pbtn.on { border-color:var(--accent);background:rgba(200,242,58,0.08);color:var(--accent); }
.picon { font-size:16px;display:block;margin-bottom:4px; }
.tgrid { display:flex;flex-wrap:wrap;gap:8px; }
.tbtn { padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;transition:all 0.15s; }
.tbtn:hover { border-color:var(--accent);color:white; }
.tbtn.on { background:var(--accent);border-color:var(--accent);color:var(--ink); }
.field { margin-bottom:14px; }
.field:last-child { margin-bottom:0; }
.field label { display:block;font-size:10px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:7px; }
.field input,.field textarea,.field select { width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:6px;padding:11px 14px;font-family:var(--mono);font-size:12px;color:white;outline:none;transition:border-color 0.15s; }
.field input:focus,.field textarea:focus,.field select:focus { border-color:rgba(200,242,58,0.4); }
.field input::placeholder,.field textarea::placeholder { color:rgba(255,255,255,0.2); }
.field textarea { resize:vertical; }
.field select option { background:#111009;color:white; }
.frow { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
.tone-row { display:flex;gap:8px;flex-wrap:wrap; }
.tnbtn { padding:7px 14px;border:1px solid var(--border);border-radius:20px;background:transparent;font-family:var(--mono);font-size:10px;color:var(--muted);cursor:pointer;transition:all 0.15s; }
.tnbtn:hover,.tnbtn.on { background:rgba(255,255,255,0.08);border-color:rgba(255,255,255,0.3);color:white; }
.custbox { background:rgba(200,242,58,0.04);border:1px solid rgba(200,242,58,0.12);border-radius:10px;padding:20px 24px;margin-bottom:16px; }
.custbox .box-title { color:var(--accent); }
.gen-btn { width:100%;background:var(--accent);color:var(--ink);font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:18px;border-radius:6px;border:none;cursor:pointer;transition:all 0.2s;margin-bottom:16px; }
.gen-btn:hover { transform:translateY(-1px);box-shadow:0 8px 24px rgba(200,242,58,0.2); }
.gen-btn:disabled { opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none; }
.lbar { display:none;align-items:center;gap:12px;padding:14px 16px;background:rgba(200,242,58,0.06);border:1px solid rgba(200,242,58,0.12);border-radius:6px;margin-bottom:16px; }
.lbar.on { display:flex; }
.spin { width:16px;height:16px;border:2px solid rgba(200,242,58,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0; }
@keyframes spin { to { transform:rotate(360deg); } }
.lsteps { display:flex;flex-direction:column;gap:4px; }
.lstep { font-size:10px;letter-spacing:1px;color:var(--muted); }
.lstep.act { color:var(--accent); }
.lstep.done { color:rgba(200,242,58,0.4); }
.out { display:none; }
.out.on { display:block; }
.osec { background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:12px;position:relative; }
.olabel { font-size:8px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;margin-bottom:12px; }
.cap-text { font-size:13px;color:var(--body);line-height:1.85;white-space:pre-wrap; }
.htags { display:flex;flex-wrap:wrap;gap:8px; }
.htag { font-size:11px;color:var(--accent);background:rgba(200,242,58,0.08);border:1px solid rgba(200,242,58,0.15);border-radius:20px;padding:4px 10px; }
.cpbtn { position:absolute;top:16px;right:16px;padding:5px 12px;border:1px solid var(--border);border-radius:4px;background:transparent;font-family:var(--mono);font-size:9px;letter-spacing:1px;color:var(--muted);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
.cpbtn:hover,.cpbtn.done { border-color:var(--accent);color:var(--accent); }
.vwrap { background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:20px 22px;margin-bottom:12px; }
.vhdr { display:flex;justify-content:space-between;align-items:center;margin-bottom:16px; }
.vlabel { font-size:8px;letter-spacing:3px;color:var(--accent);text-transform:uppercase; }
.dlbtn { padding:9px 20px;border:1px solid var(--accent);border-radius:4px;background:rgba(200,242,58,0.08);font-family:var(--display);font-weight:700;font-size:10px;letter-spacing:1px;color:var(--accent);cursor:pointer;transition:all 0.15s;text-transform:uppercase; }
.dlbtn:hover { background:rgba(200,242,58,0.18); }
#cv { width:100%;border-radius:6px; }
.rbtn { width:100%;padding:14px;border:1px solid var(--border);border-radius:6px;background:transparent;font-family:var(--mono);font-size:11px;letter-spacing:1px;color:var(--muted);cursor:pointer;transition:all 0.15s;text-transform:uppercase;margin-top:4px; }
.rbtn:hover { border-color:var(--accent);color:var(--accent); }
.err { display:none;padding:14px 16px;background:rgba(255,61,46,0.08);border:1px solid rgba(255,61,46,0.2);border-radius:6px;font-size:11px;color:#ff6b5e;margin-bottom:16px; }
.err.on { display:block; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="logo">G<span class="ai">AI</span>T</div>
    <div class="hdr-tag">Caption + Visual · @gaitrun</div>
  </div>

  <div class="box">
    <div class="box-title">Content pillar</div>
    <div class="pgrid">
      <button class="pbtn on" onclick="setPillar('journey',this)"><span class="picon">🏃</span>Jax's Journey</button>
      <button class="pbtn" onclick="setPillar('howit',this)"><span class="picon">📱</span>How GAIT Works</button>
      <button class="pbtn" onclick="setPillar('education',this)"><span class="picon">🧠</span>Education</button>
    </div>
  </div>

  <div class="box">
    <div class="box-title">Topic</div>
    <div class="tgrid" id="tgrid"></div>
  </div>

  <!-- Dynamic customisation panel -->
  <div class="custbox" id="custbox" style="display:none;">
    <div class="box-title">Customise this post</div>
    <div id="custfields"></div>
  </div>

  <div class="box">
    <div class="box-title">Context & tone</div>
    <div class="field">
      <label>Extra context (optional)</label>
      <textarea id="ctx" rows="2" placeholder="Any extra detail to include in the caption..."></textarea>
    </div>
    <div class="field">
      <label>Tone</label>
      <div class="tone-row">
        <button class="tnbtn on" onclick="setTone('honest',this)">Honest & raw</button>
        <button class="tnbtn" onclick="setTone('educational',this)">Educational</button>
        <button class="tnbtn" onclick="setTone('motivating',this)">Quietly motivating</button>
        <button class="tnbtn" onclick="setTone('minimal',this)">Minimal</button>
      </div>
    </div>
  </div>

  <button class="gen-btn" id="gbtn" onclick="generate()">Generate caption + visual →</button>

  <div class="lbar" id="lbar">
    <div class="spin"></div>
    <div class="lsteps">
      <div class="lstep" id="s1">Writing caption...</div>
      <div class="lstep" id="s2">Drawing visual...</div>
    </div>
  </div>
  <div class="err" id="err"></div>

  <div class="out" id="out">
    <div class="osec">
      <div class="olabel">Caption</div>
      <button class="cpbtn" id="ccb" onclick="cp('ctxt','ccb')">Copy</button>
      <div class="cap-text" id="ctxt"></div>
    </div>
    <div class="osec">
      <div class="olabel">Hashtags</div>
      <button class="cpbtn" id="hcb" onclick="cpH()">Copy all</button>
      <div class="htags" id="htags"></div>
    </div>
    <div class="vwrap">
      <div class="vhdr">
        <div class="vlabel">Post visual — 1080 × 1350px</div>
        <button class="dlbtn" onclick="dlPNG()">↓ Download PNG</button>
      </div>
      <canvas id="cv" width="1080" height="1350"></canvas>
    </div>
    <button class="rbtn" onclick="generate()">↻ Regenerate</button>
  </div>
</div>

<script>
// ── STATE ──
let PIL='journey', TOP='102km_month', TONE='honest', RES=null;

// ── TOPIC DEFINITIONS ──
// Each topic has: label, id, pillar, fields (custom inputs), headline, subline
const TOPICS = {
  journey: [
    { id:'102km_month', label:'102km month', headline:'102. After 6 years.', subline:'The month everything changed.',
      fields:[
        { key:'km', label:'km last month', placeholder:'102', default:'102' },

        { key:'km_this_month', label:'km so far this month', placeholder:'0', default:'0' },
        { key:'status', label:'Current status', placeholder:'In recovery — April, no running yet', default:'In recovery — April, no running yet' },

    { id:'push_mode', label:'Push Mode unlock', headline:'28 days. Unlocked.', subline:'Push Mode is live.',

        { key:'days', label:'Pain-free days', placeholder:'28', default:'28' },

    { id:'morning_pain', label:'Morning check-in — pain day', headline:'Not every morning is ready.', subline:'But GAIT is.',

        { key:'pain1', label:'Pain score 1 (0-10)', placeholder:'3', default:'3' },
        { key:'area2', label:'Injury area 2', placeholder:'Hip / glute', default:'Hip / glute' },
        { key:'pain2', label:'Pain score 2 (0-10)', placeholder:'3', default:'3' },
        { key:'area3', label:'Injury area 3 (optional)', placeholder:'Lower back', default:'Lower back' },
        { key:'pain3', label:'Pain score 3 (0-10)', placeholder:'2', default:'2' },
      ]},
    { id:'recovery_day', label:'Recovery day', headline:'Rest isn\'t giving up.', subline:'It\'s how I hit 102km.',
      fields:[
        { key:'km', label:'Monthly km', placeholder:'102', default:'102' },
        { key:'area1', label:'Injury area 1', placeholder:'Groin', default:'Groin' },
        { key:'pain1', label:'Pain 1/10', placeholder:'3', default:'3' },
        { key:'area2', label:'Injury area 2', placeholder:'Hip / glute', default:'Hip / glute' },
        { key:'pain2', label:'Pain 2/10', placeholder:'3', default:'3' },
      ]},
    { id:'overload', label:'Overload setback', headline:'The body said stop.', subline:'I listened.',
      fields:[
        { key:'areas', label:'Number of pain areas', placeholder:'3', default:'3' },
        { key:'highest_pain', label:'Highest pain score', placeholder:'3', default:'3' },
      ]},
    { id:'building_gait', label:'Building GAIT while injured', headline:'Built the fix while broken.', subline:'6 years of knee pain. 1 product.',
      fields:[
        { key:'years', label:'Years of injury', placeholder:'6', default:'6' },
      ]},
    { id:'pfps_journey', label:'6-year PFPS journey', headline:'6 years. One fix.', subline:'PFPS doesn\'t have to be forever.',
      fields:[
        { key:'years', label:'Years of injury', placeholder:'6', default:'6' },
        { key:'start_year', label:'Year injury started', placeholder:'2019', default:'2019' },
        { key:'km_now', label:'Monthly km now', placeholder:'102', default:'102' },
      ]},
    { id:'evening_routine', label:'Evening recovery routine', headline:'30 minutes every night.', subline:'Non-negotiable.',
      fields:[
        { key:'minutes', label:'Routine duration (min)', placeholder:'30', default:'30' },
      ]},
    { id:'vegan_nutrition', label:'Vegan runner nutrition', headline:'Rice protein isn\'t enough.', subline:'Add this if you\'re vegan.',
      fields:[
        { key:'protein_g', label:'Daily protein (g)', placeholder:'90', default:'90' },
      ]},
    { id:'ultra_training', label:'Training for the ultra', headline:'HM → Marathon → Ultra.', subline:'One step at a time.',
      fields:[
        { key:'hm_year', label:'Half marathon year', placeholder:'2026', default:'2026' },
        { key:'marathon_year', label:'Marathon year', placeholder:'2026', default:'2026' },
        { key:'ultra_year', label:'Ultra year', placeholder:'2027', default:'2027' },
        { key:'km_now', label:'Current weekly km', placeholder:'22', default:'22' },
      ]},
  ],
  howit: [
    { id:'blueprint_reveal', label:'Blueprint reveal', headline:'Your Blueprint. Built for you.', subline:'Not a generic plan.',
      fields:[
        { key:'injury', label:'Primary injury', placeholder:'PFPS', default:'PFPS' },
        { key:'race', label:'Race goal', placeholder:'Half marathon 2026', default:'Half marathon 2026' },
      ]},
    { id:'injury_selector', label:'Injury selector', headline:'Tap what hurts. Get real help.', subline:'Not a dropdown. A diagnosis.',
      fields:[
        { key:'area1', label:'Active area 1', placeholder:'Lower back', default:'Lower back' },
        { key:'area2', label:'Active area 2', placeholder:'Hip / glute', default:'Hip / glute' },
        { key:'area3', label:'Active area 3', placeholder:'Groin', default:'Groin' },
      ]},
    { id:'strength_circuit', label:'Strength circuit', headline:'15, 30, 45, or 1 hour.', subline:'Same blueprint. Your time.',
      fields:[
        { key:'active_duration', label:'Active duration tab', placeholder:'45', default:'45',
          type:'select', options:['15','30','45','60'] },
      ]},
    { id:'coaching_response', label:'Coaching response', headline:'Not just a plan. An explanation.', subline:'Every exercise has a reason.',
      fields:[
        { key:'exercise', label:'Featured exercise name', placeholder:'Glute Bridge Bilateral', default:'Glute Bridge Bilateral' },
        { key:'why', label:'The "why" line', placeholder:'Activates the strained glute safely — restores the glute-to-back connection.', default:'Activates the strained glute safely.' },
      ]},
    { id:'push_mode_feature', label:'Push Mode feature', headline:'28 days pain-free. Push harder.', subline:'GAIT rewards consistency.',
      fields:[
        { key:'days', label:'Current pain-free days', placeholder:'14', default:'14' },
      ]},
    { id:'multi_injury', label:'Multi-injury tracking', headline:'Three areas. One plan.', subline:'GAIT handles complexity.',
      fields:[
        { key:'area1', label:'Area 1', placeholder:'Lower back', default:'Lower back' },
        { key:'pain1', label:'Pain 1', placeholder:'3/10', default:'3/10' },
        { key:'area2', label:'Area 2', placeholder:'Hip / glute', default:'Hip / glute' },
        { key:'pain2', label:'Pain 2', placeholder:'3/10', default:'3/10' },
        { key:'area3', label:'Area 3', placeholder:'Groin', default:'Groin' },
        { key:'pain3', label:'Pain 3', placeholder:'2/10', default:'2/10' },
      ]},
    { id:'mileage_rules', label:'Mileage rules', headline:'Your body sets the rules.', subline:'GAIT writes them down.',
      fields:[
        { key:'green_rule', label:'Green rule', placeholder:'Run if pain is 0–2/10', default:'Run if pain is 0–2/10' },
        { key:'amber_rule', label:'Amber rule', placeholder:'Reduce 30% if pain is 3/10', default:'Reduce 30% if pain is 3/10' },
        { key:'red_rule', label:'Red rule', placeholder:'No running if pain is 4/10+', default:'No running if pain is 4/10+' },
      ]},
    { id:'legacy_pricing', label:'First 100 users — €4.99', headline:'First 100. €4.99. Forever.', subline:'Legacy pricing. No catch.',
      fields:[
        { key:'price', label:'Legacy price', placeholder:'4.99', default:'4.99' },
        { key:'standard_price', label:'Standard price after', placeholder:'7.99', default:'7.99' },
        { key:'spots_taken', label:'Spots taken so far', placeholder:'12', default:'12' },

  education: [
    { id:'runners_knee', label:"Runner's knee = hip problem", headline:"Your knee isn't the problem.", subline:'Your hip is.',
      fields:[]},
    { id:'itband', label:'IT band stretching fails', headline:"You can't stretch your IT band.", subline:'Here\'s what actually works.',
      fields:[]},
    { id:'rest_alone', label:'Rest alone fails', headline:'Rest removes pain. Not the cause.', subline:"That's why it keeps coming back.",
      fields:[]},
    { id:'ten_percent', label:'10% rule is wrong', headline:'The 10% rule is made up.', subline:"Here's what the evidence says.",
      fields:[]},
    { id:'groin_vs_hip', label:'Groin vs hip flexor', headline:'Groin or hip flexor?', subline:"Most runners can't tell. Here's the test.",
      fields:[]},
    { id:'glute_knee', label:'Glute weakness → knee pain', headline:'Weak glutes. Knee pain.', subline:'The connection most runners miss.',
      fields:[]},
    { id:'lysine', label:'Lysine for vegan runners', headline:'Rice protein has a gap.', subline:'One amino acid fills it.',
      fields:[
        { key:'protein_g', label:'Daily protein (g)', placeholder:'90', default:'90' },
      ]},
    { id:'overload_multi', label:'Overload hits multiple areas', headline:"It's not 3 injuries. It's 1.", subline:'Overload shows up everywhere.',
      fields:[
        { key:'area1', label:'Pain area 1', placeholder:'Groin', default:'Groin' },
        { key:'area2', label:'Pain area 2', placeholder:'Hip / glute', default:'Hip / glute' },
        { key:'area3', label:'Pain area 3', placeholder:'Lower back', default:'Lower back' },
      ]},
  ],
};

// ── INIT ──
function init() { renderTopics(); updateCustFields(); }

function renderTopics() {
  const g = document.getElementById('tgrid');
  g.innerHTML = TOPICS[PIL].map((t,i) =>
    `<button class="tbtn${i===0?' on':''}" onclick="setTopic('${t.id}',this)">${t.label}</button>`
  ).join('');
  TOP = TOPICS[PIL][0].id;
}

function setPillar(p, btn) {
  PIL = p;
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderTopics();
  updateCustFields();
  document.getElementById('out').classList.remove('on');
}

function setTopic(id, btn) {
  TOP = id;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  updateCustFields();
}

function setTone(t, btn) {
  TONE = t;
  document.querySelectorAll('.tnbtn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
}

function getTopicDef() {
  return TOPICS[PIL].find(t=>t.id===TOP) || TOPICS[PIL][0];
}

function updateCustFields() {
  const def = getTopicDef();
  const box = document.getElementById('custbox');
  const container = document.getElementById('custfields');
  if (!def.fields || def.fields.length === 0) {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'block';
  // Group fields into rows of 2
  let html = '';
  for (let i = 0; i < def.fields.length; i += 2) {
    const f1 = def.fields[i];
    const f2 = def.fields[i+1];
    if (f2) {
      html += `<div class="frow">`;
      html += renderField(f1);
      html += renderField(f2);
      html += `</div>`;
    } else {
      html += renderField(f1);
    }
  }
  container.innerHTML = html;
}

function renderField(f) {
  if (f.type === 'select') {
    return `<div class="field"><label>${f.label}</label><select id="cf_${f.key}">${f.options.map(o=>`<option value="${o}"${o===f.default?' selected':''}>${o} min</option>`).join('')}</select></div>`;
  }
  return `<div class="field"><label>${f.label}</label><input type="text" id="cf_${f.key}" placeholder="${f.placeholder}" value="${f.default}"></div>`;
}

function getCustomValues() {
  const def = getTopicDef();
  const vals = {};
  (def.fields || []).forEach(f => {
    const el = document.getElementById('cf_' + f.key);
    vals[f.key] = el ? el.value.trim() || f.default : f.default;
  });
  return vals;
}

// ── PROMPT ──
function buildPrompt() {
  const def = getTopicDef();
  const vals = getCustomValues();
  const ctx = document.getElementById('ctx').value.trim();
  const tones = {
    honest: 'honest and raw — like a real runner texting a mate. Real emotions. Slightly tired sometimes.',
    educational: 'informative and conversational — teach one thing clearly, no jargon',
    motivating: 'quietly motivating — not hype, like a knowledgeable friend who genuinely believes in you',
    minimal: 'minimal and confident — short, let the numbers speak',
  };
  const pillars = {
    journey: 'Personal story from Jax, first person. Open with the real moment or pain point. Mention GAIT naturally as what helped — never as a sales pitch.',
    howit: 'Show a GAIT feature in action. Describe what the runner sees and experiences. Make it feel like a real product moment.',
    education: 'Teach one specific thing about running injuries. Lead with the counter-intuitive truth. Practical and actionable.',
  };

  // Build custom data context
  const customContext = Object.entries(vals).map(([k,v]) => `${k}: ${v}`).join(', ');

  return `You write Instagram captions for @gaitrun — AI running coach for injury-prone runners.

Jax, 39, Porto Portugal, 6 years PFPS, vegan, desk job, training for ultra 2027.
Last month (March 2026): ran 102km — biggest month in 6 years.

// ── API ──
async function callAPI(prompt, max) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:max, messages:[{role:'user',content:prompt}] })
  });
  const data = await res.json();
  const text = data.content?.[0]?.text;
  if (!text) throw new Error(data.error?.message || 'No API response');
  return text;
}

// ── GENERATE ──
async function generate() {
  const btn = document.getElementById('gbtn');
  const lbar = document.getElementById('lbar');
  const out = document.getElementById('out');
  const err = document.getElementById('err');
  btn.disabled = true;
  lbar.classList.add('on');
  out.classList.remove('on');
  err.classList.remove('on');
  document.getElementById('s1').className = 'lstep act';
  document.getElementById('s2').className = 'lstep';

  try {
    const raw = await callAPI(buildPrompt(), 700);
    let clean = raw.replace(/```json\s*/gi,'').replace(/```\s*/g,'').trim();
    const f=clean.indexOf('{'), l=clean.lastIndexOf('}');
    if(f!==-1&&l!==-1) clean=clean.substring(f,l+1);
    RES = JSON.parse(clean);

    document.getElementById('ctxt').textContent = RES.caption;
    document.getElementById('htags').innerHTML = (RES.hashtags||[]).map(h=>`<span class="htag">${h.startsWith('#')?h:'#'+h}</span>`).join('');
    document.getElementById('s1').className = 'lstep done';
    document.getElementById('s2').className = 'lstep act';
    out.classList.add('on');

    await drawPost(RES, getCustomValues(), getTopicDef());
    document.getElementById('s2').className = 'lstep done';
  } catch(e) {
    err.textContent = `Error: ${e.message}. Please try again.`;
    err.classList.add('on');
  } finally {
    btn.disabled = false;
    lbar.classList.remove('on');
  }
}

  ctx.fillStyle='#0a0908'; ctx.fillRect(0,0,W,H);

  ctx.fillStyle=g1; ctx.fillRect(0,0,W,H);

  ctx.fillStyle=g2; ctx.fillRect(0,0,W,H);

  // Top bar
  ctx.strokeStyle='rgba(255,255,255,0.06)'; ctx.lineWidth=1;
  ln(ctx,0,108,W,108);
  ctx.font='400 22px "DM Mono"'; ctx.fillStyle='rgba(255,255,255,0.22)'; ctx.textAlign='left';
  ctx.fillText(now.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}),56,74);

  // GAIT Logo
  ctx.font='900 34px "Unbounded"';
  const gW=ctx.measureText('G').width, aiW=ctx.measureText('AI').width, tW=ctx.measureText('T').width;
  const lx=W/2-(gW+aiW+tW)/2;
  ctx.textAlign='left'; ctx.fillStyle='white'; ctx.fillText('G',lx,76);
  ctx.fillStyle='#ff3d2e'; ctx.fillText('AI',lx+gW,76);
  ctx.fillStyle='white'; ctx.fillText('T',lx+gW+aiW,76);
  ctx.font='400 16px "DM Mono"'; ctx.fillStyle='rgba(255,255,255,0.18)';
  ctx.textAlign='right'; ctx.fillText('@gaitrun',W-56,74);

  // Date
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}).toUpperCase();
  ctx.font='400 17px "DM Mono"'; ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.textAlign='left'; ctx.fillText(dateStr,56,156);

  // Route to the right draw function based on topic
  const drawFn = DRAW_FNS[def.id] || drawGeneric;
  drawFn(ctx, W, H, r, vals, def);

  // Bottom strip
  ctx.strokeStyle='rgba(255,255,255,0.05)'; ctx.lineWidth=1; ln(ctx,0,H-88,W,H-88);
  ctx.font='400 16px "DM Mono"'; ctx.fillStyle='rgba(255,255,255,0.15)';
  ctx.textAlign='left'; ctx.fillText('gait.run — injury-aware running coach',56,H-50);
  ctx.fillStyle='rgba(200,242,58,0.4)'; ctx.textAlign='right';
  ctx.fillText('@gaitrun',W-56,H-50);
}

// ── HELPERS ──
function ln(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function wrapTxt(c,txt,x,y,maxW,lh){if(!txt)return;const ws=txt.split(' ');let line='',cy=y;for(const w of ws){const t=line+(line?' ':'')+w;if(c.measureText(t).width>maxW&&line){c.fillText(line,x,cy);line=w;cy+=lh;}else{line=t;}}if(line)c.fillText(line,x,cy);}
function wrapTxt2(c,txt,x,y,maxW,lh,font,col){c.font=font;c.fillStyle=col;wrapTxt(c,txt,x,y,maxW,lh);}
function drawHL(c,hl,aw,x,y,maxW,lh){
  c.font='900 68px "Unbounded"';
  const words=hl.split(' ');let cx=x,cy=y;const sp=c.measureText(' ').width;
  for(let i=0;i<words.length;i++){
    const w=words[i],ww=c.measureText(w).width;
    if(cx>x&&cx+ww>x+maxW){cx=x;cy+=lh;}
    const isA=w.toLowerCase().replace(/[^a-z0-9]/g,'')===aw.toLowerCase().replace(/[^a-z0-9]/g,'');
    c.fillStyle=isA?'#c8f23a':'white';c.textAlign='left';c.fillText(w,cx,cy);
    cx+=ww+(i<words.length-1?sp:0);
  }
}

async function cp(id,bid){
  await navigator.clipboard.writeText(document.getElementById(id).textContent);
  const b=document.getElementById(bid);b.textContent='Copied ✓';b.classList.add('done');
  setTimeout(()=>{b.textContent='Copy';b.classList.remove('done');},2000);
}
async function cpH(){
  const t=Array.from(document.querySelectorAll('.htag')).map(e=>e.textContent).join(' ');

}
